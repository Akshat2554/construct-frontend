<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Construct</title>
    <link rel="stylesheet" href="styles.css?v=2">
    </head>
<body class="login-body">
    <aside class="login-art" aria-hidden="true">
        <div class="login-art-brand">
            <span class="sb-logo-mark">C</span>
            <span class="sb-logo-text">Construct</span>
        </div>
        <svg class="login-plan" id="login-plan" viewBox="0 0 540 380" fill="none" stroke="currentColor" stroke-linecap="square">
            <!-- room fills light up in turn: measure each room -->
            <g class="plan-rooms" stroke="none" fill="currentColor">
                <rect class="room r1" x="40" y="60" width="210" height="130"/>
                <rect class="room r2" x="250" y="60" width="230" height="90"/>
                <rect class="room r3" x="250" y="150" width="230" height="180"/>
                <rect class="room r4" x="40" y="190" width="210" height="140"/>
            </g>
            <g class="plan-walls" stroke-width="3">
                <path d="M40 60 H480 V330 H40 Z"/>
                <path d="M250 60 V200 M250 240 V330"/>
                <path d="M40 190 H170 M210 190 H250"/>
                <path d="M250 150 H390 M430 150 H480"/>
            </g>
            <g class="plan-doors" stroke-width="1.5">
                <path d="M170 190 A40 40 0 0 1 210 230"/>
                <path d="M250 200 A40 40 0 0 0 290 240"/>
                <path d="M390 150 A40 40 0 0 1 430 110"/>
            </g>
            <g class="plan-dims" stroke-width="1">
                <path d="M40 30 H480 M40 22 V38 M480 22 V38 M250 22 V38"/>
                <path d="M510 60 V330 M502 60 H518 M502 330 H518 M502 150 H518 M502 190 H518"/>
                <path d="M34 24 L46 36 M244 24 L256 36 M474 24 L486 36"/>
            </g>
            <!-- laser measure: a dot runs the dimension strings, the string fills in behind it -->
            <path class="plan-measured" d="M40 30 H480" stroke-width="2"/>
            <path class="plan-measured v" d="M510 60 V330" stroke-width="2"/>
            <circle class="plan-laser" r="4" stroke="none" fill="currentColor">
                <animateMotion dur="6s" repeatCount="indefinite" begin="1.8s" keyPoints="0;0.62;0.62;1;1" keyTimes="0;0.4;0.5;0.9;1" calcMode="linear" path="M40 30 H480 M510 60 V330"/>
            </circle>
            <g class="plan-labels" stroke="none" fill="currentColor" font-family="Inter, sans-serif" font-size="12">
                <text x="145" y="22" text-anchor="middle">6 300</text>
                <text x="365" y="22" text-anchor="middle">6 900</text>
                <text x="530" y="200" text-anchor="middle" transform="rotate(90 530 200)">8 100</text>
                <text x="145" y="120" text-anchor="middle" font-size="11">CONFERENCE</text>
                <text class="area a1" x="145" y="137" text-anchor="middle" font-size="11">264.5 sqft</text>
                <text x="365" y="100" text-anchor="middle" font-size="11">CABIN</text>
                <text class="area a2" x="365" y="117" text-anchor="middle" font-size="11">200.5 sqft</text>
                <text x="365" y="236" text-anchor="middle" font-size="11">OPEN OFFICE</text>
                <text class="area a3" x="365" y="253" text-anchor="middle" font-size="11">401.1 sqft</text>
                <text x="145" y="256" text-anchor="middle" font-size="11">RECEPTION</text>
                <text class="area a4" x="145" y="273" text-anchor="middle" font-size="11">284.8 sqft</text>
            </g>
        </svg>
        <p class="login-art-line"><span class="w w1">Measure.</span> <span class="w w2">Source.</span> <span class="w w3">Cost.</span> <span class="w w4">Approve.</span></p>
    </aside>

    <main class="login-card">
        <div class="login-brand">
            <span class="sb-logo-mark" aria-hidden="true">C</span>
            <span class="sb-logo-text">Construct</span>
        </div>
        <h1 class="login-title">Sign in</h1>
        <p class="login-sub">Internal Procurement Platform</p>

        <form id="login-form" class="stack" style="gap:14px" novalidate>
            <label class="field">
                <span class="field-label">Username</span>
                <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </label>
            <label class="field">
                <span class="field-label">Password</span>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </label>
            <p id="error-msg" class="login-error" role="alert" style="display:none">Incorrect username or password</p>
            <button type="submit" id="login-btn" class="btn btn-primary btn-block" style="min-height:42px;margin-top:4px">Sign in</button>
        </form>
    </main>

    <script>
        // Check if already logged in. Must check sessionStorage, not localStorage -
        // login() below writes to sessionStorage (and so does auth.js on every other
        // page). Checking the wrong storage here caused a bad bug: a stale
        // 'true' left behind in localStorage from an older build would send you to
        // dashboard.html, whose auth.js would immediately bounce you back here
        // because sessionStorage was empty - back and forth forever.
        if (sessionStorage.getItem('construct-auth') === 'true') {
            window.location.href = 'dashboard.html';
        }
        // Clean up any stale flag so it can never cause this again.
        localStorage.removeItem('construct-auth');

        // The floor plan keeps working until you're signed in, then holds still.
        function stopPlan() {
            let art = document.querySelector('.login-art');
            let plan = document.getElementById('login-plan');
            if (art) art.classList.add('is-done');
            if (plan && plan.pauseAnimations) plan.pauseAnimations();
        }
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) stopPlan();

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });

        function showLoginError(msg) {
            let el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function login() {
    let username = document.getElementById('username').value.trim();
    let password = document.getElementById('password').value;
    let btn = document.getElementById('login-btn');
    document.getElementById('error-msg').style.display = 'none';
    if (!username || !password) {
        showLoginError('Enter your username and password');
        return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    
    try {
        let response = await fetch('https://construct-backend-production.up.railway.app/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            let data = await response.json();
            sessionStorage.setItem('construct-token', data.token);
            sessionStorage.setItem('construct-user', data.username);
            sessionStorage.setItem('construct-role', data.role || 'ADMIN');
            sessionStorage.setItem('construct-auth', 'true');
            stopPlan();
            window.location.replace('dashboard.html');
        } else {
            showLoginError('Incorrect username or password');
            btn.disabled = false;
            btn.textContent = 'Sign in';
        }
    } catch (e) {
        showLoginError("Couldn't reach the server. Check your connection and try again.");
        btn.disabled = false;
        btn.textContent = 'Sign in';
    }
}
    </script>
</body>
</html>
