                        style="font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit">+ Add</button>

<script>
    let projectId = localStorage.getItem('selectedProjectId');
    let projectName = localStorage.getItem('selectedProjectName');

    function switchView(view) {
    document.getElementById('view-overview').style.display = view === 'overview' ? 'block' : 'none';
    document.getElementById('view-layout').style.display = view === 'layout' ? 'block' : 'none';
    document.getElementById('view-boq').style.display = view === 'boq' ? 'block' : 'none';
    document.getElementById('view-shortlist').style.display = view === 'shortlist' ? 'block' : 'none';
    
    document.getElementById('overview-btn').classList.toggle('active', view === 'overview');
    document.getElementById('layout-btn').classList.toggle('active', view === 'layout');
    document.getElementById('boq-btn').classList.toggle('active', view === 'boq');
    document.getElementById('shortlist-btn').classList.toggle('active', view === 'shortlist');
    
    if (view === 'layout') loadLayout();
}

let _projectData = null;

async function loadAllProjectData() {
    let [cart, confirmed, notes, subItems, shortlist, versions] = await Promise.all([
        authFetch(`${API}/api/boq/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/confirmed-categories/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/boq-notes/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/boq-subitems/project/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/vendor-shortlist/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/versions/${projectId}`).then(r => r.json())
    ]);
    
    _projectData = { cart, confirmed, notes, subItems, shortlist, versions };
    return _projectData;
}

    async function loadProjectDetails() {

    document.getElementById('project-subtitle').textContent = 
        (project.clientName || '') + 
        (project.location ? ' · ' + project.location : '') + 
        (project.squareFootage ? ' · ' + project.squareFootage + ' sqft' : '') +
        (project.budget ? ' · ₹' + Number(project.budget).toLocaleString('en-IN') : '');

    let roomsRes = await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + projectId);
    let rooms = await roomsRes.json();

    let confirmed = await getConfirmed();

let shortlist = await shortlistRes.json();

                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">₹${project.budget ? (project.budget/10000000).toFixed(2) + ' Cr' : '—'}</div>

                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">${rooms.length}</div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Shortlisted Vendors</div>

            </div>

    document.querySelector('.page-body').style.gridTemplateColumns = '';

    let allDrawings = await drawingsRes.json();
    
    let roomsRes = await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + projectId);
    let allRooms = await roomsRes.json();

    let savedFloors = JSON.parse(localStorage.getItem('floors-' + projectId)) || [1];
    let floorList = [...new Set([...savedFloors, currentFloor])].sort((a, b) => a - b);

    let drawings = allDrawings.filter(d => parseInt(d.floorNumber) === parseInt(currentFloor));
    let rooms = allRooms.filter(r => parseInt(r.floorNumber) === parseInt(currentFloor));

    let layout = document.getElementById('view-layout');
    layout.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:12px">
                <span style="font-size:13px;font-weight:600;color:var(--text-primary)">Floor</span>
                <select id="floor-selector" onchange="currentFloor=parseInt(this.value);loadLayout()" 
                    style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text-primary)">
                    ${floorList.map(f => `<option value="${f}" ${f === currentFloor ? 'selected' : ''}>Floor ${f}</option>`).join('')}
                </select>
                <button onclick="addFloor(${Math.max(...floorList) + 1})" 
                    style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;font-family:inherit;font-size:12.5px;color:var(--text-secondary);cursor:pointer">
                    + Add Floor
                </button>
                ${currentFloor > 1 ? `
    <button onclick="deleteFloor(${currentFloor})"
        style="padding:6px 12px;border:1px solid var(--destructive);border-radius:6px;background:transparent;color:var(--destructive);font-size:12px;font-family:inherit;cursor:pointer">
        Delete Floor
    </button>
` : ''}
            </div>
            <div style="display:flex;gap:8px">
                ${drawings.length === 0 ? `
                    <label class="add-btn" style="font-size:12px;padding:6px 14px;cursor:pointer">
                        Upload Drawing
                        <input type="file" id="drawing-upload" accept="image/*,.pdf" style="display:none" 
                            onchange="uploadDrawing(this, ${currentFloor})">
                    </label>
                ` : `
                    <span style="font-size:12px;color:var(--text-muted);align-self:center">${drawings[0].displayName || 'Floor ' + currentFloor + ' drawing'}</span>
                    <label class="add-btn" style="font-size:12px;padding:6px 14px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text-secondary)">
                        Replace
                        <input type="file" id="drawing-upload" accept="image/*,.pdf" style="display:none"
                            onchange="uploadDrawing(this, ${currentFloor}, ${drawings[0].id})">
                    </label>
                    <button onclick="deleteDrawing(${drawings[0].id})" 
    style="padding:6px 12px;border:1px solid var(--destructive);border-radius:6px;background:transparent;color:var(--destructive);font-size:12px;font-family:inherit;cursor:pointer">
    Delete Drawing
</button>
                `}
                <button class="add-btn" onclick="openAddRoomModal()" style="font-size:12px;padding:6px 14px">+ Add Room</button>
            </div>
        </div>

        <div style="display:flex;gap:16px;height:calc(100vh - 260px)">
            
            <!-- Left: Drawing -->
            <div style="flex:1;border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;background:var(--surface)">
                ${drawings.length === 0 ? `
                    <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-muted)">
                        <div style="font-size:40px">📐</div>

                    </div>
                ` : drawings[0].fileName && drawings[0].fileName.toLowerCase().endsWith('.pdf') ? `
                    <iframe src="https://construct-backend-production.up.railway.app/api/files/${drawings[0].fileName}" 
                        style="width:100%;height:100%;border:none;display:block"></iframe>
                ` : `
    <div style="position:relative;width:100%;height:100%">
        <img id="drawing-img" style="width:100%;height:100%;object-fit:contain;display:block;cursor:crosshair">
        <div id="pins-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></div>
    </div>
`}
            </div>

            <!-- Right: Room List -->
            <div style="width:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px">

                <div id="room-list"></div>
            </div>
        </div>
    `;

    renderRoomList(rooms);

    if (drawings.length > 0 && drawings[0].fileName && !drawings[0].fileName.toLowerCase().endsWith('.pdf')) {
    requestAnimationFrame(function() {
        let img = document.getElementById('drawing-img');
        if (!img) return;
        
        if (img.complete && img.naturalWidth > 0) {
            renderPins(rooms);
            img.addEventListener('click', function(e) {
    let containerRect = this.getBoundingClientRect();
    let { offsetX, offsetY, renderedW, renderedH } = getImageRenderRect(this);
    
    let x = ((e.clientX - containerRect.left - offsetX) / renderedW) * 100;
    let y = ((e.clientY - containerRect.top - offsetY) / renderedH) * 100;
    
    // Clamp to image bounds
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    
    openAddRoomModal(x, y);
});

        } else {
            img.addEventListener('load', function() {
                renderPins(rooms);
                img.addEventListener('click', function(e) {
    let containerRect = this.getBoundingClientRect();
    let { offsetX, offsetY, renderedW, renderedH } = getImageRenderRect(this);
    
    let x = ((e.clientX - containerRect.left - offsetX) / renderedW) * 100;
    let y = ((e.clientY - containerRect.top - offsetY) / renderedH) * 100;
    
    // Clamp to image bounds
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    
    openAddRoomModal(x, y);
});
            });
        }
    });
    let proxyUrl = 'https://construct-backend-production.up.railway.app/api/files/proxy?url=' + encodeURIComponent(drawings[0].fileName);
console.log('authFetching proxy:', proxyUrl);
authFetch(proxyUrl)
    .then(r => {
        console.log('response status:', r.status);
        return r.blob();
    })
    .then(blob => {
        console.log('blob size:', blob.size);
        let blobUrl = URL.createObjectURL(blob);
        // Re-query the element in case DOM changed
        let img = document.getElementById('drawing-img');
        console.log('img after authFetch:', img);
        if (img) {
            img.src = blobUrl;
            console.log('src set successfully');
        } else {
            console.log('img element gone - DOM was re-rendered');
        }
    })
    .catch(e => console.log('authFetch error:', e));
    }
}

function getImageRenderRect(img) {
    let containerRect = img.getBoundingClientRect();
    let containerW = containerRect.width;
    let containerH = containerRect.height;
    let imgW = img.naturalWidth;
    let imgH = img.naturalHeight;
    
    let scale = Math.min(containerW / imgW, containerH / imgH);
    let renderedW = imgW * scale;
    let renderedH = imgH * scale;
    let offsetX = (containerW - renderedW) / 2;
    let offsetY = (containerH - renderedH) / 2;
    
    return { offsetX, offsetY, renderedW, renderedH };
}

function addFloor(floorNum) {
    currentFloor = floorNum;
    loadLayout();
}

async function uploadDrawing(input, floorNumber, existingId) {
    let file = input.files[0];
    if (!file) return;

    let remarks = '';
    if (existingId) {
        remarks = prompt('Why is this drawing being replaced? (optional)') || '';
    }

    if (existingId) {
        await authFetch('https://construct-backend-production.up.railway.app/api/drawings/' + existingId, { method: 'DELETE' });
    }

    let formData = new FormData();
    formData.append('file', file);

    let uploadRes = await authFetch('https://construct-backend-production.up.railway.app/api/files/upload', {
        method: 'POST',
        body: formData
    });
    let fileName = await uploadRes.text();

    let today = new Date().toISOString().split('T')[0];
    await authFetch('https://construct-backend-production.up.railway.app/api/drawings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            projectId: parseInt(projectId),
            fileName: fileName,
            displayName: 'Floor ' + floorNumber + ' Drawing',
            uploadedAt: today,
            floorNumber: floorNumber
        })
    });

    createVersion(
        existingId ? 'Drawing replaced on Floor ' + floorNumber : 'Drawing uploaded on Floor ' + floorNumber,
        remarks
    );
    loadLayout();
}

async function deleteDrawing(id) {
    if (confirm('Delete this drawing? This cannot be undone.')) {
        await authFetch('https://construct-backend-production.up.railway.app/api/drawings/' + id, { method: 'DELETE' });
        createVersion('Drawing deleted on Floor ' + currentFloor);
        loadLayout();
    }
}

async function deleteFloor(floorNum) {
    if (confirm('Delete Floor ' + floorNum + '? All rooms and drawings on this floor will be deleted.')) {
        // Delete all rooms on this floor
        let roomsRes = await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + projectId);
        let allRooms = await roomsRes.json();
        let floorRooms = allRooms.filter(r => parseInt(r.floorNumber) === floorNum);
        for (let room of floorRooms) {
            await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + room.id, { method: 'DELETE' });
        }

        // Delete all drawings on this floor
        let drawingsRes = await authFetch('https://construct-backend-production.up.railway.app/api/drawings/' + projectId);
        let allDrawings = await drawingsRes.json();
        let floorDrawings = allDrawings.filter(d => parseInt(d.floorNumber) === floorNum);
        for (let drawing of floorDrawings) {
            await authFetch('https://construct-backend-production.up.railway.app/api/drawings/' + drawing.id, { method: 'DELETE' });
        }

        // Remove from localStorage floors list
        let floors = JSON.parse(localStorage.getItem('floors-' + projectId)) || [1];
        floors = floors.filter(f => f !== floorNum);
        localStorage.setItem('floors-' + projectId, JSON.stringify(floors));

        // Go back to floor 1
        currentFloor = 1;
        loadLayout();
    }
}

async function updateCalcItem(id, field, value) {
    let item = [..._calcItems.exclusion, ..._calcItems.inclusion].find(i => i.id === id);
    if (!item) return;
    item[field] = field === 'area' ? parseFloat(value) || 0 : value;
    await authFetch(`${API}/api/room-calculations/${id}`, {
        method: 'PUT', // need to add this endpoint
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item)
    });
    recalcModal();
}

function recalcModal() {
    let type = _currentCalcType;
    let baseArea = type === 'paint'
        ? parseFloat(document.getElementById('wall-area-value').value) || 0
        : parseFloat(document.getElementById('area-input').value) || 0;
    
    let totalExclusions = _calcItems.exclusion.reduce((s, i) => s + (parseFloat(i.area) || 0), 0);
    let totalInclusions = _calcItems.inclusion.reduce((s, i) => s + (parseFloat(i.area) || 0), 0);
    let netArea = Math.max(0, baseArea - totalExclusions + totalInclusions);
    
    let exclusionLines = _calcItems.exclusion.map(i => `- ${i.area || 0} sqft (${i.name || 'unnamed'})`).join('<br>');
    let inclusionLines = _calcItems.inclusion.map(i => `+ ${i.area || 0} sqft (${i.name || 'unnamed'})`).join('<br>');
    
    let result = '—';
    let workingHtml = `${baseArea} sqft (base)`;
    if (exclusionLines) workingHtml += `<br>${exclusionLines}`;
    if (inclusionLines) workingHtml += `<br>${inclusionLines}`;
    workingHtml += `<br><strong>= ${netArea.toFixed(1)} sqft (net)</strong>`;
    
    if (type === 'paint') {
        let coats = parseFloat(document.getElementById('modal-paint-coats')?.value) || _roomCalcValues.paintCoats;
        let coverage = parseFloat(document.getElementById('modal-paint-coverage')?.value) || _roomCalcValues.paintCoverage;
        let litres = (netArea * coats) / coverage;
        result = litres.toFixed(1) + ' L';
        workingHtml += `<br>${netArea.toFixed(1)} × ${coats} coats ÷ ${coverage} = <strong>${result}</strong>`;
    } else if (type === 'flooring') {
        let tileSize = parseFloat(document.getElementById('modal-floor-tile')?.value) || _roomCalcValues.floorTile;
        let wastage = parseFloat(document.getElementById('modal-floor-wastage')?.value) || _roomCalcValues.floorWastage;
        let tileSqft = (tileSize / 304.8) * (tileSize / 304.8);
        let tiles = Math.ceil(netArea * (1 + wastage / 100) / tileSqft);
        result = tiles + ' tiles';
        workingHtml += `<br>${netArea.toFixed(1)} sqft × ${(1 + wastage/100).toFixed(2)} ÷ ${tileSqft.toFixed(3)} sqft/tile = <strong>${result}</strong>`;
    } else if (type === 'ceiling') {
    let length = _roomCalcValues.length;
    let breadth = _roomCalcValues.breadth;
    let perimeter = 2 * (length + breadth);
    let edgeTrim = Math.ceil(perimeter / (600 * 304.8));
    result = Math.ceil(netArea) + ' sqft + ' + edgeTrim + ' rft trim';
        workingHtml += `<br>Perimeter: ${(perimeter/1000).toFixed(2)}m → ${edgeTrim} rft edge trim`;
        workingHtml += `<br>Result: <strong>${result}</strong>`;
    }
    
    document.getElementById('calc-working').innerHTML = workingHtml;
    document.getElementById('calc-result-display').textContent = result;
    
    // Store result for apply
    window._calcResult = result;
    window._calcNetArea = netArea;
}

document.getElementById('calc-apply-btn').addEventListener('click', function() {
    let type = _currentCalcType;
    if (type === 'paint') {
        let el = document.getElementById('paint-result');
        if (el) el.textContent = window._calcResult;
        let coatsEl = document.getElementById('paint-coats');
        if (coatsEl) coatsEl.value = document.getElementById('modal-paint-coats').value;
        let covEl = document.getElementById('paint-coverage');
        if (covEl) covEl.value = document.getElementById('modal-paint-coverage').value;
    } else if (type === 'flooring') {
        let el = document.getElementById('floor-result');
        if (el) el.textContent = window._calcResult;
        let tileEl = document.getElementById('floor-tile');
        if (tileEl) tileEl.value = document.getElementById('modal-floor-tile').value;
        let wastEl = document.getElementById('floor-wastage');
        if (wastEl) wastEl.value = document.getElementById('modal-floor-wastage').value;
    } else if (type === 'ceiling') {
        let el = document.getElementById('ceiling-result');
        if (el) el.textContent = window._calcResult;
    }
    document.getElementById('calc-modal').classList.remove('open');
});

function calcPaint() {
    let wallArea = parseFloat(document.getElementById('wall-area-value').value) || 0;
    let coats = parseFloat(document.getElementById('paint-coats').value) || 2;
    let coverage = parseFloat(document.getElementById('paint-coverage').value) || 120;
    let litres = (wallArea * coats) / coverage;
    let result = litres > 0 ? litres.toFixed(1) : '—';
    document.getElementById('paint-result').textContent = result;
}

function calcFlooring() {
    let area = parseFloat(document.getElementById('area-input').value) || 0;
    let tileSize = parseFloat(document.getElementById('floor-tile').value) || 600;
    let wastage = parseFloat(document.getElementById('floor-wastage').value) || 10;
    let tileSqft = (tileSize / 304.8) * (tileSize / 304.8);
    let tiles = area > 0 ? Math.ceil((area * (1 + wastage / 100)) / tileSqft) : 0;
    document.getElementById('floor-result').textContent = tiles > 0 ? tiles : '—';
}

function calcCeiling() {
    let area = parseFloat(document.getElementById('area-input').value) || 0;
    let length = parseFloat(document.getElementById('room-length-val').value) || 0;
    let breadth = parseFloat(document.getElementById('room-breadth-val').value) || 0;
    let tiles = Math.ceil(area);
    let perimeterMm = 2 * (length + breadth);
    let edgeTrim = perimeterMm > 0 ? Math.ceil(perimeterMm / (600 * 304.8)) : 0;
    document.getElementById('ceiling-result').textContent = area > 0 ? `${tiles} sqft + ${edgeTrim} rft` : '—';
}

async function updateRoomDimension(roomId, field, value) {
    let response = await authFetch('https://construct-backend-production.up.railway.app/api/rooms/single/' + roomId);
    let room = await response.json();
    room[field] = parseFloat(value);
    
    if (room.length && room.breadth) {
        let newArea = parseFloat(((room.length * room.breadth) / 92903).toFixed(1));
        let newWallArea = parseFloat((2 * (room.length + room.breadth) * (room.height || 3000) / 92903).toFixed(1));
        room.area = newArea;
        room.wallArea = newWallArea;
        
        let areaInput = document.getElementById('area-input');
        if (areaInput) areaInput.value = newArea;
        let wallInput = document.getElementById('wall-area-value');
        if (wallInput) wallInput.value = newWallArea;
    }
    
    await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + roomId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(room)
    });
}

function getEffectiveArea(roomId) {
    let saved = localStorage.getItem('room-area-' + roomId);
    return saved !== null ? parseFloat(saved) : 0;
}

async function deleteRoom(id) {
    if (confirm('Delete this room? This cannot be undone.')) {
        await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + id, { method: 'DELETE' });
        createVersion(name + ' deleted');
        loadLayout();
    }
}

document.getElementById('room-cancel').addEventListener('click', function() {
    document.getElementById('room-modal').classList.remove('open');
});

document.getElementById('room-confirm').addEventListener('click', async function() {
    let name = document.getElementById('room-name').value.trim();
    if (!name) { alert('Please enter a room name'); return; }

    let room = {
        projectId: parseInt(projectId),
        name,
        roomType: document.getElementById('room-type').value,
        length: parseFloat(document.getElementById('room-length').value) || null,
        breadth: parseFloat(document.getElementById('room-breadth').value) || null,
        height: parseFloat(document.getElementById('room-height').value) || null,
        pinX: pendingPinX,
        pinY: pendingPinY,
        floorNumber: currentFloor,
        drawingId: null
    };

    await authFetch('https://construct-backend-production.up.railway.app/api/rooms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(room)
    });
    createVersion('Room added: ' + name);

    document.getElementById('room-modal').classList.remove('open');
    loadLayout();
});

document.getElementById('pin-modal-cancel').addEventListener('click', function() {
    document.getElementById('pin-modal').classList.remove('open');
});

document.getElementById('pin-modal-confirm').addEventListener('click', async function(e) {
    e.preventDefault();
    if (this._firing) return;
    this._firing = true;
    setTimeout(() => this._firing = false, 1000);
    let selected = document.querySelector('input[name="pin-product"]:checked');
    if (!selected) { alert('Select a product'); return; }
    let note = document.getElementById('pin-note-field').value;
    document.getElementById('pin-modal').classList.remove('open');
    await placePinOnRender(currentRenderId, parseInt(selected.value), _pendingPinX, _pendingPinY, note);
});

loadProjectDetails();
updateCartCount();
