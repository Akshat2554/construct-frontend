<!DOCTYPE html>
<html>
    <head>
        <title>Project details</title>
        <link rel="stylesheet" href="styles.css">
        <script src="auth.js"></script>
        <script src="toast.js"></script>
        <script src="api.js"></script>
        <script src="cart.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    </head>
<body>

    <div class="global-topbar">
        <div class="logo">Construct</div>
        <div style="display:flex;gap:10px;align-items:center;margin-left:auto">
            <a href="catalog.html" class="nav-btn">Catalog</a>
            <a href="index.html" class="nav-btn">Projects</a>
            <a href="boq-detail.html" class="nav-btn cart-btn"> BOQ <span id="cart-count">0</span></a>
        </div>
    </div>

    <div class="page-body">
        <div class="sidebar">
            <a href="index.html" class="nav-btn">← Projects</a>
            <button class="boq-nav-btn active" id="layout-btn" onclick="switchView('layout')">Overview</button>
            <button class="boq-nav-btn" id="shortlist-btn" onclick="switchView('shortlist')">Vendor Shortlist</button>
<button class="boq-nav-btn" id="updates-btn" onclick="switchView('updates')">Updates</button>
        </div>
        <div class="main-content">
            <div style="margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)">
                <h1 id="project-title" style="font-family:'Syne',sans-serif;margin-bottom:4px"></h1>
                <span id="project-subtitle" style="font-size:13px;color:var(--text-muted)"></span>
            </div>
            <div id="view-layout"></div>
            <div id="view-shortlist" style="display:none"></div>
            <div id="view-updates" style="display:none"></div>
        </div>
    </div>

    <div class="modal-overlay" id="pin-modal">
        <div class="modal" style="width:380px">
            <h2 style="margin-bottom:8px">Pin Product</h2>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">Which product is at this location?</p>
            <div id="pin-product-checklist" style="max-height:240px;overflow-y:auto;margin-bottom:16px"></div>
            <input type="text" id="pin-note-field" placeholder="Add a note (optional)"
                style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);margin-bottom:16px">
            <div class="modal-buttons">
                <button id="pin-modal-cancel">Cancel</button>
                <button id="pin-modal-confirm" class="add-btn">Place Pin</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="calc-modal">
        <div class="modal" style="width:500px;max-width:95vw">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
                <h2 id="calc-modal-title" style="margin:0"></h2>
                <button onclick="document.getElementById('calc-modal').classList.remove('open')"
                    style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted)">✕</button>
            </div>
    
            <!-- Base area -->
            <div style="background:var(--bg);border-radius:8px;padding:12px 16px;margin-bottom:16px">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:12px;color:var(--text-muted)">Base Area</span>
                    <span id="calc-base-area" style="font-size:14px;font-weight:700;color:var(--text-primary)">—</span>
                </div>
            </div>
    
            <!-- Exclusions -->
            <div style="margin-bottom:16px">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                    <span style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">Exclusions</span>
                    <button onclick="addCalcItem('exclusion')"
                        style="font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit">+ Add</button>
                </div>
                <div id="calc-exclusions"></div>
            </div>
    
            <!-- Inclusions -->
            <div style="margin-bottom:16px">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                    <span style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">Inclusions</span>
                    <button onclick="addCalcItem('inclusion')"
                        style="font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit">+ Add</button>
                </div>
                <div id="calc-inclusions"></div>
            </div>
    
            <!-- Calculator specific inputs -->
            <div id="calc-specific-inputs" style="margin-bottom:16px"></div>
    
            <!-- Working -->
            <div style="background:var(--bg);border-radius:8px;padding:12px 16px;margin-bottom:16px">
                <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Working</div>
                <div id="calc-working" style="font-size:12.5px;color:var(--text-secondary);line-height:1.8"></div>
                <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:12px;color:var(--text-muted)">Result</span>
                    <span id="calc-result-display" style="font-size:16px;font-weight:700;color:var(--accent)">—</span>
                </div>
            </div>
    
            <div class="modal-buttons">
                <button onclick="document.getElementById('calc-modal').classList.remove('open')">Close</button>
                <button id="calc-apply-btn" class="add-btn">Apply</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="room-modal">
        <div class="modal">
            <h2 id="room-modal-title">Add Room</h2>
            <input type="text" id="room-name" placeholder="Room name (e.g. Conference Room A)">
            <select id="room-type">
                <option value="">Room type</option>
                <option value="Office">Office</option>
                <option value="Conference">Conference</option>
                <option value="Reception">Reception</option>
                <option value="Kitchen">Kitchen</option>
                <option value="Bathroom">Bathroom</option>
                <option value="Co-Working">Co-Working</option>
                <option value="Storage">Storage</option>
                <option value="Corridor">Corridor</option>
                <option value="Other">Other</option>
            </select>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
                <input type="number" id="room-length" placeholder="Length (mm)">
                <input type="number" id="room-breadth" placeholder="Breadth (mm)">
                <input type="number" id="room-height" placeholder="Height (mm)">
            </div>
            <div class="modal-buttons">
                <button id="room-cancel">Cancel</button>
                <button id="room-confirm">Add Room</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="vendor-modal">
        <div class="modal">
            <h2>Add Vendor to Shortlist</h2>
            <input type="text" id="vendor-name" placeholder="Supplier name">
            <input type="text" id="vendor-category" placeholder="Category (e.g. Furniture, Flooring)">
            <select id="vendor-status">
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
            </select>
            <input type="text" id="vendor-notes" placeholder="Notes (optional)">
            <div class="modal-buttons">
                <button id="vendor-cancel">Cancel</button>
                <button id="vendor-confirm" class="add-btn">Add</button>
            </div>
        </div>
    </div>

<script>
    let projectId = localStorage.getItem('selectedProjectId');
    let projectName = localStorage.getItem('selectedProjectName');
    let _renders = [];
    let _renderAssignments = [];
    let currentRenderId = null;
    let _roomCalcValues = { paintCoats: 2, paintCoverage: 120, floorTile: 600, floorWastage: 10, length: 0, breadth: 0 };

    function switchView(view) {
    document.getElementById('view-layout').style.display = view === 'layout' ? 'block' : 'none';
    document.getElementById('view-shortlist').style.display = view === 'shortlist' ? 'block' : 'none';
    document.getElementById('view-updates').style.display = view === 'updates' ? 'block' : 'none';

    document.getElementById('layout-btn').classList.toggle('active', view === 'layout');
    document.getElementById('shortlist-btn').classList.toggle('active', view === 'shortlist');
    document.getElementById('updates-btn').classList.toggle('active', view === 'updates');

    if (view === 'updates') loadUpdates();
    if (view === 'layout') loadLayout();
    if (view === 'shortlist') loadVendorShortlist();
}

let _projectData = null;

async function loadAllProjectData() {
    let [cart, confirmed, notes, subItems, shortlist, versions] = await Promise.all([
        authFetch(`${API}/api/boq/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/confirmed-categories/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/boq-notes/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/boq-subitems/project/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/vendor-shortlist/${projectId}`).then(r => r.json()),
        authFetch(`${API}/api/versions/${projectId}`).then(r => r.json())
    ]);
    
    _projectData = { cart, confirmed, notes, subItems, shortlist, versions };
    return _projectData;
}

async function loadVendorShortlist() {
    let container = document.getElementById('view-shortlist');
    container.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Loading...</p>';
    
    let response = await authFetch(`${API}/api/vendor-shortlist/${projectId}`);
    let shortlist = await response.json();
    
    let statusColors = { 'Approved': '#2E4F42', 'Pending': '#8A6A2E', 'Rejected': '#C0392B' };
    
    let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <span style="font-size:13px;color:var(--text-muted)">Vendors shortlisted for this project</span>
            <button class="add-btn" onclick="openVendorModal()" style="padding:7px 14px;font-size:12.5px">+ Add Vendor</button>
        </div>
    `;
    
    if (shortlist.length === 0) {
        html += '<p style="color:var(--text-muted);font-size:13px">No vendors shortlisted yet.</p>';
    } else {
        html += `<table class="list-table">
            <thead><tr><th>Supplier</th><th>Category</th><th>Status</th><th>Notes</th><th></th></tr></thead>
            <tbody>
                ${shortlist.map(vendor => `
                    <tr>
                        <td style="font-weight:500">${vendor.supplierName}</td>
                        <td style="color:var(--text-muted)">${vendor.category || '—'}</td>
                        <td><span style="font-size:11px;font-weight:600;color:${statusColors[vendor.status]};background:${statusColors[vendor.status]}18;padding:3px 8px;border-radius:4px">${vendor.status}</span></td>
                        <td style="color:var(--text-secondary)">${vendor.notes || '—'}</td>
                        <td><button onclick="removeVendor(${vendor.id})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px" onmouseover="this.style.color='var(--destructive)'" onmouseout="this.style.color='var(--text-muted)'">✕</button></td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;
    }
    
    container.innerHTML = html;
}

function openVendorModal() {
    document.getElementById('vendor-name').value = '';
    document.getElementById('vendor-category').value = '';
    document.getElementById('vendor-status').value = 'Pending';
    document.getElementById('vendor-notes').value = '';
    document.getElementById('vendor-modal').classList.add('open');
}

async function removeVendor(id) {
    await authFetch(`${API}/api/vendor-shortlist/${id}`, { method: 'DELETE' });
    showToast('Vendor removed', 'info');
    loadVendorShortlist();
}

// Auto-open room if returning from catalog
let returnToRoom = localStorage.getItem('addingToRoom');
if (returnToRoom) {
    localStorage.removeItem('addingToRoom');
    switchView('layout');
    // Wait for layout to load then open the room
    setTimeout(async function() {
        let response = await authFetch('https://construct-backend-production.up.railway.app/api/rooms/single/' + returnToRoom);
        let room = await response.json();
        openRoomDetail(room);
    }, 500);
}

let currentFloor = 1;

async function loadLayout() {
    let projectRes = await authFetch(`${API}/api/projects/${projectId}`);
    let project = await projectRes.json();
    document.getElementById('project-title').textContent = project.name;
    document.getElementById('project-subtitle').textContent = 
        (project.clientName || '') + 
        (project.location ? ' · ' + project.location : '') +
        (project.squareFootage ? ' · ' + project.squareFootage + ' sqft' : '');

    document.querySelector('.sidebar').style.display = '';
    document.querySelector('.main-content > div:first-child').style.display = '';
    document.querySelector('.main-content').style.padding = '';
    document.querySelector('.page-body').style.gridTemplateColumns = '';
    
    let drawingsRes = await authFetch('https://construct-backend-production.up.railway.app/api/drawings/' + projectId);
    let allDrawings = await drawingsRes.json();
    
    let roomsRes = await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + projectId);
    let allRooms = await roomsRes.json();

    let savedFloors = JSON.parse(localStorage.getItem('floors-' + projectId)) || [1];
    let floorList = [...new Set([...savedFloors, currentFloor])].sort((a, b) => a - b);

    let drawings = allDrawings.filter(d => parseInt(d.floorNumber) === parseInt(currentFloor));
    let rooms = allRooms.filter(r => parseInt(r.floorNumber) === parseInt(currentFloor));

    let layout = document.getElementById('view-layout');
    layout.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:12px">
                <span style="font-size:13px;font-weight:600;color:var(--text-primary)">Floor</span>
                <select id="floor-selector" onchange="currentFloor=parseInt(this.value);loadLayout()" 
                    style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text-primary)">
                    ${floorList.map(f => `<option value="${f}" ${f === currentFloor ? 'selected' : ''}>Floor ${f}</option>`).join('')}
                </select>
                <button onclick="addFloor(${Math.max(...floorList) + 1})" 
                    style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;font-family:inherit;font-size:12.5px;color:var(--text-secondary);cursor:pointer">
                    + Add Floor
                </button>
                ${currentFloor > 1 ? `
    <button onclick="deleteFloor(${currentFloor})"
        style="padding:6px 12px;border:1px solid var(--destructive);border-radius:6px;background:transparent;color:var(--destructive);font-size:12px;font-family:inherit;cursor:pointer">
        Delete Floor
    </button>
` : ''}
            </div>
            <div style="display:flex;gap:8px">
                ${drawings.length === 0 ? `
                    <label class="add-btn" style="font-size:12px;padding:6px 14px;cursor:pointer">
                        Upload Drawing
                        <input type="file" id="drawing-upload" accept="image/*,.pdf" style="display:none" 
                            onchange="uploadDrawing(this, ${currentFloor})">
                    </label>
                ` : `
                    <span style="font-size:12px;color:var(--text-muted);align-self:center">${drawings[0].displayName || 'Floor ' + currentFloor + ' drawing'}</span>
                    <label class="add-btn" style="font-size:12px;padding:6px 14px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text-secondary)">
                        Replace
                        <input type="file" id="drawing-upload" accept="image/*,.pdf" style="display:none"
                            onchange="uploadDrawing(this, ${currentFloor}, ${drawings[0].id})">
                    </label>
                    <button onclick="deleteDrawing(${drawings[0].id})" 
    style="padding:6px 12px;border:1px solid var(--destructive);border-radius:6px;background:transparent;color:var(--destructive);font-size:12px;font-family:inherit;cursor:pointer">
    Delete Drawing
</button>
                `}
                <button class="add-btn" onclick="openAddRoomModal()" style="font-size:12px;padding:6px 14px">+ Add Room</button>
            </div>
        </div>

        <div style="display:flex;gap:16px;height:calc(100vh - 260px)">
            
            <!-- Left: Drawing -->
            <div style="flex:1;border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;background:var(--surface)">
                ${drawings.length === 0 ? `
                    <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-muted)">
                        <div style="font-size:40px">📐</div>
                        <div style="font-size:13px">Upload a drawing for Floor ${currentFloor}</div>
                    </div>
                ` : drawings[0].fileName && drawings[0].fileName.toLowerCase().endsWith('.pdf') ? `
                    <iframe src="https://construct-backend-production.up.railway.app/api/files/${drawings[0].fileName}" 
                        style="width:100%;height:100%;border:none;display:block"></iframe>
                ` : `
    <div style="position:relative;width:100%;height:100%">
        <img id="drawing-img" style="width:100%;height:100%;object-fit:contain;display:block;cursor:crosshair">
        <div id="pins-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></div>
    </div>
`}
            </div>

            <!-- Right: Room List -->
            <div style="width:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px">
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">${rooms.length} room${rooms.length !== 1 ? 's' : ''} on Floor ${currentFloor}</div>
                <div id="room-list"></div>
            </div>
        </div>
    `;

    renderRoomList(rooms);

    // Calculate totals from all rooms on this floor
    let totalPaintArea = allRooms.reduce((s, r) => {
    if (!r.length || !r.breadth || !r.height) return s;
    return s + (2 * (r.length + r.breadth) * r.height / 92903);
}, 0);

let totalFloorArea = allRooms.reduce((s, r) => {
    if (!r.length || !r.breadth) return s;
    return s + (r.length * r.breadth / 92903);
}, 0);

let totalCeilingArea = totalFloorArea;

// Add totals bar to layout header
let totalsBar = document.createElement('div');
totalsBar.style.cssText = 'display:flex;gap:24px;padding:10px 0;margin-bottom:12px;border-bottom:1px solid var(--border)';
totalsBar.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">Paint Area</span>
        <input type="number" id="total-paint-area" value="${project.totalPaintArea || totalPaintArea.toFixed(0)}"
            style="width:80px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-weight:700;color:var(--text-primary);background:transparent;font-family:inherit;text-align:center"
            onchange="saveProjectTotal('totalPaintArea', this.value)">
        <span style="font-size:11px;color:var(--text-muted)">sqft</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">Floor Area</span>
        <input type="number" id="total-floor-area" value="${project.totalFloorArea || totalFloorArea.toFixed(0)}"
            style="width:80px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-weight:700;color:var(--text-primary);background:transparent;font-family:inherit;text-align:center"
            onchange="saveProjectTotal('totalFloorArea', this.value)">
        <span style="font-size:11px;color:var(--text-muted)">sqft</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">Ceiling Area</span>
        <input type="number" id="total-ceiling-area" value="${project.totalCeilingArea || totalCeilingArea.toFixed(0)}"
            style="width:80px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-weight:700;color:var(--text-primary);background:transparent;font-family:inherit;text-align:center"
            onchange="saveProjectTotal('totalCeilingArea', this.value)">
        <span style="font-size:11px;color:var(--text-muted)">sqft</span>
    </div>
`;
layout.insertBefore(totalsBar, layout.firstChild);

    if (drawings.length > 0 && drawings[0].fileName && !drawings[0].fileName.toLowerCase().endsWith('.pdf')) {
    requestAnimationFrame(function() {
        let img = document.getElementById('drawing-img');
        if (!img) return;
        
        if (img.complete && img.naturalWidth > 0) {
            renderPins(rooms);
            img.addEventListener('click', function(e) {
    let containerRect = this.getBoundingClientRect();
    let { offsetX, offsetY, renderedW, renderedH } = getImageRenderRect(this);
    
    let x = ((e.clientX - containerRect.left - offsetX) / renderedW) * 100;
    let y = ((e.clientY - containerRect.top - offsetY) / renderedH) * 100;
    
    // Clamp to image bounds
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    
    openAddRoomModal(x, y);
});

        } else {
            img.addEventListener('load', function() {
                renderPins(rooms);
                img.addEventListener('click', function(e) {
    let containerRect = this.getBoundingClientRect();
    let { offsetX, offsetY, renderedW, renderedH } = getImageRenderRect(this);
    
    let x = ((e.clientX - containerRect.left - offsetX) / renderedW) * 100;
    let y = ((e.clientY - containerRect.top - offsetY) / renderedH) * 100;
    
    // Clamp to image bounds
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    
    openAddRoomModal(x, y);
});
            });
        }
    });
    let proxyUrl = 'https://construct-backend-production.up.railway.app/api/files/proxy?url=' + encodeURIComponent(drawings[0].fileName);
authFetch(proxyUrl)
    .then(r => {
        return r.blob();
    })
    .then(blob => {
        let blobUrl = URL.createObjectURL(blob);
        // Re-query the element in case DOM changed
        let img = document.getElementById('drawing-img');
        if (img) {
            img.src = blobUrl;
        } else {
        }
    })
    .catch(e => console.log('authFetch error:', e));
    }
}

function getImageRenderRect(img) {
    let containerRect = img.getBoundingClientRect();
    let containerW = containerRect.width;
    let containerH = containerRect.height;
    let imgW = img.naturalWidth;
    let imgH = img.naturalHeight;
    
    let scale = Math.min(containerW / imgW, containerH / imgH);
    let renderedW = imgW * scale;
    let renderedH = imgH * scale;
    let offsetX = (containerW - renderedW) / 2;
    let offsetY = (containerH - renderedH) / 2;
    
    return { offsetX, offsetY, renderedW, renderedH };
}

function addFloor(floorNum) {
    currentFloor = floorNum;
    loadLayout();
}

async function uploadDrawing(input, floorNumber, existingId) {
    let file = input.files[0];
    if (!file) return;

    let remarks = '';
    if (existingId) {
        remarks = prompt('Why is this drawing being replaced? (optional)') || '';
    }

    if (existingId) {
        await authFetch('https://construct-backend-production.up.railway.app/api/drawings/' + existingId, { method: 'DELETE' });
    }

    let formData = new FormData();
    formData.append('file', file);

    let uploadRes = await authFetch('https://construct-backend-production.up.railway.app/api/files/upload', {
        method: 'POST',
        body: formData
    });
    let fileName = await uploadRes.text();

    let today = new Date().toISOString().split('T')[0];
    await authFetch('https://construct-backend-production.up.railway.app/api/drawings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            projectId: parseInt(projectId),
            fileName: fileName,
            displayName: 'Floor ' + floorNumber + ' Drawing',
            uploadedAt: today,
            floorNumber: floorNumber
        })
    });

    createVersion(
        existingId ? 'Drawing replaced on Floor ' + floorNumber : 'Drawing uploaded on Floor ' + floorNumber,
        remarks
    );
    loadLayout();
}

async function saveProjectTotal(field, value) {
    let res = await authFetch(`${API}/api/projects/${projectId}`);
    let project = await res.json();
    project[field] = parseFloat(value) || 0;
    await authFetch(`${API}/api/projects/${projectId}`, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify(project)
    });
}

async function deleteFloor(floorNum) {
    if (confirm('Delete Floor ' + floorNum + '? All rooms and drawings on this floor will be deleted.')) {
        // Delete all rooms on this floor
        let roomsRes = await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + projectId);
        let allRooms = await roomsRes.json();
        let floorRooms = allRooms.filter(r => parseInt(r.floorNumber) === floorNum);
        for (let room of floorRooms) {
            await authFetch('https://construct-backend-production.up.railway.app/api/rooms/' + room.id, { method: 'DELETE' });
        }

        // Delete all drawings on this floor
        let drawingsRes = await authFetch('https://construct-backend-production.up.railway.app/api/drawings/' + projectId);
        let allDrawings = await drawingsRes.json();
        let floorDrawings = allDrawings.filter(d => parseInt(d.floorNumber) === floorNum);
        for (let drawing of floorDrawings) {
            await authFetch('https://construct-backend-production.up.railway.app/api/drawings/' + drawing.id, { method: 'DELETE' });
        }

        // Remove from localStorage floors list
        let floors = JSON.parse(localStorage.getItem('floors-' + projectId)) || [1];
        floors = floors.filter(f => f !== floorNum);
        localStorage.setItem('floors-' + projectId, JSON.stringify(floors));

        // Go back to floor 1
        currentFloor = 1;
        loadLayout();
    }
}

    _renders.forEach(r => {
        let thumb = document.getElementById('thumb-' + r.id);
        if (thumb) thumb.style.borderColor = r.id === renderId ? 'var(--accent)' : 'var(--border)';
    });
    
    let render = _renders.find(r => r.id === renderId);
    if (!render) return;
    
    // Just update the image src
    let img = document.getElementById('render-img');
    if (img) {
        img.src = render.fileName;
    } else {
        // Image element doesn't exist, rebuild canvas content
        let canvas = document.getElementById('render-canvas');
        if (canvas) {
            canvas.innerHTML = `
                <img id="render-img" src="${render.fileName}"
                    style="width:100%;height:100%;object-fit:contain;display:block">
                <div id="render-pins-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></div>
            `;
        }
    }
    
    await renderRenderPins(renderId);
}

async function renderCalculators() {
    let wallArea = parseFloat(document.getElementById('wall-area-value').value) || 0;
    let floorArea = parseFloat(document.getElementById('area-input').value) || 0;
    let length = _roomCalcValues.length;
    let breadth = _roomCalcValues.breadth;

    // Calculate net areas from openings
    let activeOpenings = _roomOpenings.filter(o => o.active !== false);
    let totalExclusions = activeOpenings.filter(o => o.itemType === 'exclusion').reduce((s, o) => s + (o.area || 0), 0);
    let totalInclusions = activeOpenings.filter(o => o.itemType === 'inclusion').reduce((s, o) => s + (o.area || 0), 0);

    let netWallArea = Math.max(0, wallArea - totalExclusions + totalInclusions);
    let netFloorArea = floorArea;

    // Paint
    let paintLitres = (_roomCalcValues.paintCoats * netWallArea) / _roomCalcValues.paintCoverage;

    // Flooring
    let tileSizeMm = _roomCalcValues.floorTile;
    let wastage = _roomCalcValues.floorWastage;
    let tileSqft = (tileSizeMm / 304.8) * (tileSizeMm / 304.8);
    let tiles = tileSqft > 0 ? Math.ceil(netFloorArea * (1 + wastage / 100) / tileSqft) : 0;

    // Ceiling
    let perimeterMm = 2 * (length + breadth);
    let edgeTrim = perimeterMm > 0 ? Math.ceil(perimeterMm / (600 * 304.8)) : 0;

    // Group openings
    let doors = _roomOpenings.filter(o => o.type === 'door');
    let windows = _roomOpenings.filter(o => o.type === 'window');
    let custom = _roomOpenings.filter(o => o.type === 'custom');

let _allLogs = [];
let _logsShown = 50;

async function loadUpdates() {
    let container = document.getElementById('view-updates');
    container.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Loading...</p>';
    
    let res = await authFetch(`${API}/api/activity/${projectId}`);
    _allLogs = await res.json();
    _logsShown = 50;
    
    renderUpdates('');
}

function renderUpdates(searchTerm) {
    let container = document.getElementById('view-updates');
    
    let filtered = searchTerm 
        ? _allLogs.filter(l => 
            (l.action || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (l.details || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (l.username || '').toLowerCase().includes(searchTerm.toLowerCase())
          )
        : _allLogs;
    
    let visible = filtered.slice(0, _logsShown);
    
    // Search bar
    let html = `
        <div style="margin-bottom:16px;display:flex;align-items:center;gap:8px">
            <input type="text" placeholder="Search updates..." 
                value="${searchTerm}"
                oninput="renderUpdates(this.value)"
                style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text-primary);outline:none"
                onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
            <span style="font-size:12px;color:var(--text-muted);white-space:nowrap">${filtered.length} entries</span>
        </div>
    `;
    
    if (filtered.length === 0) {
        html += '<p style="color:var(--text-muted);font-size:13px">No results found.</p>';
        container.innerHTML = html;
        return;
    }
    
    // Group by date
    let groups = {};
    visible.forEach(function(log) {
        let date = new Date(log.timestamp);
        let today = new Date();
        let yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        
        let dateKey;
        if (date.toDateString() === today.toDateString()) {
            dateKey = 'Today';
        } else if (date.toDateString() === yesterday.toDateString()) {
            dateKey = 'Yesterday';
        } else {
            dateKey = date.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        
        if (!groups[dateKey]) groups[dateKey] = [];
        groups[dateKey].push(log);
    });
    
    Object.keys(groups).forEach(function(dateKey) {
        html += `<div style="margin-bottom:24px">
            <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)">${dateKey}</div>`;
        
        groups[dateKey].forEach(function(log) {
            let time = new Date(log.timestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            html += `
                <div style="display:grid;grid-template-columns:55px 80px 1fr;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border)">
                    <span style="font-size:11.5px;color:var(--text-muted)">${time}</span>
                    <span style="font-size:12px;font-weight:600;color:var(--accent)">${log.username}</span>
                    <div>
                        <div style="font-size:13px;font-weight:500;color:var(--text-primary)">${log.action}</div>
                        ${log.details ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px">${log.details}</div>` : ''}
                    </div>
                </div>
            `;
        });
        
        html += '</div>';
    });
    
    // Show more button
    if (filtered.length > _logsShown) {
        html += `
            <div style="text-align:center;padding:16px 0">
                <button onclick="_logsShown += 50; renderUpdates(document.querySelector('#view-updates input').value)"
                    style="padding:8px 20px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer;font-family:inherit">
                    Show more (${filtered.length - _logsShown} remaining)
                </button>
            </div>
        `;
    }
    
    container.innerHTML = html;

    let input = container.querySelector('input');
    if (input && searchTerm !== undefined) {
        input.focus();
        input.setSelectionRange(searchTerm.length, searchTerm.length);
    }
}

            container.appendChild(row);
        });
    });

async function addCalcItem(itemType) {
    let res = await authFetch(`${API}/api/room-calculations`, {
        method: 'POST',
        headers: authHeaders() ,
        body: JSON.stringify({
            roomId: currentRoomId,
            calculatorType: _currentCalcType,
            itemType: itemType,
            name: '',
            area: 0
        })
    });
    let item = await res.json();
    _calcItems[itemType].push(item);
    renderCalcItems();
    recalcModal();
}

async function removeCalcItem(id, itemType) {
    await authFetch(`${API}/api/room-calculations/${id}`, { method: 'DELETE' });
    _calcItems[itemType] = _calcItems[itemType].filter(i => i.id !== id);
    renderCalcItems();
    recalcModal();
}

async function updateCalcItem(id, field, value) {
    let item = [..._calcItems.exclusion, ..._calcItems.inclusion].find(i => i.id === id);
    if (!item) return;
    item[field] = field === 'area' ? parseFloat(value) || 0 : value;
    await authFetch(`${API}/api/room-calculations/${id}`, {
        method: 'PUT', // need to add this endpoint
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item)
    });
    recalcModal();
}

function recalcModal() {
    let type = _currentCalcType;
    let baseArea = type === 'paint'
        ? parseFloat(document.getElementById('wall-area-value').value) || 0
        : parseFloat(document.getElementById('area-input').value) || 0;
    
    let totalExclusions = _calcItems.exclusion.reduce((s, i) => s + (parseFloat(i.area) || 0), 0);
    let totalInclusions = _calcItems.inclusion.reduce((s, i) => s + (parseFloat(i.area) || 0), 0);
    let netArea = Math.max(0, baseArea - totalExclusions + totalInclusions);
    
    let exclusionLines = _calcItems.exclusion.map(i => `- ${i.area || 0} sqft (${i.name || 'unnamed'})`).join('<br>');
    let inclusionLines = _calcItems.inclusion.map(i => `+ ${i.area || 0} sqft (${i.name || 'unnamed'})`).join('<br>');
    
    let result = '—';
    let workingHtml = `${baseArea} sqft (base)`;
    if (exclusionLines) workingHtml += `<br>${exclusionLines}`;
    if (inclusionLines) workingHtml += `<br>${inclusionLines}`;
    workingHtml += `<br><strong>= ${netArea.toFixed(1)} sqft (net)</strong>`;
    
    if (type === 'paint') {
        let coats = parseFloat(document.getElementById('modal-paint-coats')?.value) || _roomCalcValues.paintCoats;
        let coverage = parseFloat(document.getElementById('modal-paint-coverage')?.value) || _roomCalcValues.paintCoverage;
        let litres = (netArea * coats) / coverage;
        result = litres.toFixed(1) + ' L';
        workingHtml += `<br>${netArea.toFixed(1)} × ${coats} coats ÷ ${coverage} = <strong>${result}</strong>`;
    } else if (type === 'flooring') {
        let tileSize = parseFloat(document.getElementById('modal-floor-tile')?.value) || _roomCalcValues.floorTile;
        let wastage = parseFloat(document.getElementById('modal-floor-wastage')?.value) || _roomCalcValues.floorWastage;
        let tileSqft = (tileSize / 304.8) * (tileSize / 304.8);
        let tiles = Math.ceil(netArea * (1 + wastage / 100) / tileSqft);
        result = tiles + ' tiles';
        workingHtml += `<br>${netArea.toFixed(1)} sqft × ${(1 + wastage/100).toFixed(2)} ÷ ${tileSqft.toFixed(3)} sqft/tile = <strong>${result}</strong>`;
    } else if (type === 'ceiling') {
    let length = _roomCalcValues.length;
    let breadth = _roomCalcValues.breadth;
    let perimeter = 2 * (length + breadth);
    let edgeTrim = Math.ceil(perimeter / (600 * 304.8));
    result = Math.ceil(netArea) + ' sqft + ' + edgeTrim + ' rft trim';
        workingHtml += `<br>Perimeter: ${(perimeter/1000).toFixed(2)}m → ${edgeTrim} rft edge trim`;
        workingHtml += `<br>Result: <strong>${result}</strong>`;
    }
    
    document.getElementById('calc-working').innerHTML = workingHtml;
    document.getElementById('calc-result-display').textContent = result;
    
    // Store result for apply
    window._calcResult = result;
    window._calcNetArea = netArea;
}

document.getElementById('calc-apply-btn').addEventListener('click', function() {
    let type = _currentCalcType;
    if (type === 'paint') {
        _roomCalcValues.paintCoats = parseFloat(document.getElementById('modal-paint-coats')?.value) || 2;
        _roomCalcValues.paintCoverage = parseFloat(document.getElementById('modal-paint-coverage')?.value) || 120;
    } else if (type === 'flooring') {
        _roomCalcValues.floorTile = parseFloat(document.getElementById('modal-floor-tile')?.value) || 600;
        _roomCalcValues.floorWastage = parseFloat(document.getElementById('modal-floor-wastage')?.value) || 10;
    }
    document.getElementById('calc-modal').classList.remove('open');
    renderCalculators();
});


async function updateRoomDimension(roomId, field, value) {
    let response = await authFetch(`${API}/api/rooms/single/${roomId}`);
    let room = await response.json();
    room[field] = parseFloat(value);
    
    if (room.length && room.breadth) {
        let newArea = parseFloat(((room.length * room.breadth) / 92903).toFixed(1));
        let newWallArea = parseFloat((2 * (room.length + room.breadth) * (room.height || 3000) / 92903).toFixed(1));
        room.area = newArea;
        room.wallArea = newWallArea;
        
        // Update hidden inputs
        let areaInput = document.getElementById('area-input');
        if (areaInput) areaInput.value = newArea;
        let wallInput = document.getElementById('wall-area-value');
        if (wallInput) wallInput.value = newWallArea;
        
        // Update header display stats
        document.getElementById('header-wall-area') && (document.getElementById('header-wall-area').textContent = newWallArea);
document.getElementById('header-floor-area') && (document.getElementById('header-floor-area').textContent = newArea);
document.getElementById('header-ceiling-area') && (document.getElementById('header-ceiling-area').textContent = newArea);
renderCalculators();
        
        // Update calc values
        _roomCalcValues.length = room.length || 0;
        _roomCalcValues.breadth = room.breadth || 0;
        
        // Re-render calculators
        renderCalculators();
    }
    
    await authFetch(`${API}/api/rooms/${roomId}`, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify(room)
    });
}

async function saveRoomFinal(field, value) {
    let response = await authFetch(`${API}/api/rooms/single/${currentRoomId}`);
    let room = await response.json();
    room[field] = parseFloat(value) || null;
    await authFetch(`${API}/api/rooms/${currentRoomId}`, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify(room)
    });
}

let _currentOpeningType = 'door';

async function openOpeningModal(type) {
    _currentOpeningType = type;
    
    let titles = { door: 'Doors', window: 'Windows', custom: '+ Custom Item' };
    document.getElementById('opening-modal-title').textContent = titles[type];
    
    // Show/hide fields based on type
    let dimFields = document.getElementById('opening-dimension-fields');
    let areaField = document.getElementById('opening-area-field');
    let typeField = document.getElementById('opening-type-field');
    let preview = document.getElementById('opening-calc-preview');
    
    if (type === 'custom') {
        dimFields.style.display = 'none';
        areaField.style.display = 'block';
        typeField.style.display = 'block';
        preview.style.display = 'none';
    } else {
        dimFields.style.display = 'grid';
        areaField.style.display = 'none';
        typeField.style.display = 'none';
        preview.style.display = 'block';
    }
    
    // Clear form
    document.getElementById('opening-name').value = '';
    document.getElementById('opening-width').value = '';
    document.getElementById('opening-height').value = '';
    document.getElementById('opening-area').value = '';
    preview.textContent = '';
    
    // Render existing items
    let existing = _roomOpenings.filter(o => o.type === type);
    let list = document.getElementById('opening-items-list');
    
    if (existing.length === 0) {
        list.innerHTML = `<p style="font-size:12px;color:var(--text-muted)">No ${type}s added yet.</p>`;
    } else {
        list.innerHTML = existing.map(item => `
            <div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:6px">
                <input type="checkbox" ${item.active !== false ? 'checked' : ''}
                    onchange="toggleOpening(${item.id}, this.checked)"
                    style="accent-color:var(--accent)">
                <span style="flex:1;font-size:13px;color:var(--text-primary)">${item.name}</span>
                ${item.width && item.height ? `<span style="font-size:11px;color:var(--text-muted)">${item.width}×${item.height}mm</span>` : ''}
                <span style="font-size:12px;font-weight:600;color:var(--accent)">${(item.area||0).toFixed(2)} sqft</span>
                <button onclick="deleteOpening(${item.id})"
                    style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px"
                    onmouseover="this.style.color='var(--destructive)'"
                    onmouseout="this.style.color='var(--text-muted)'">✕</button>
            </div>
        `).join('');
    }
    
    document.getElementById('opening-modal').classList.add('open');
}

function updateOpeningArea() {
    let w = parseFloat(document.getElementById('opening-width').value) || 0;
    let h = parseFloat(document.getElementById('opening-height').value) || 0;
    let preview = document.getElementById('opening-calc-preview');
    if (w > 0 && h > 0) {
        let area = (w * h) / 92903;
        preview.textContent = `Area: ${area.toFixed(2)} sqft (will be excluded)`;
    } else {
        preview.textContent = '';
    }
}

async function saveOpening() {
    let name = document.getElementById('opening-name').value.trim();
    if (!name) { showToast('Please enter a name', 'warning'); return; }
    
    let body = {
        roomId: currentRoomId,
        type: _currentOpeningType,
        name,
        active: true
    };
    
    if (_currentOpeningType === 'custom') {
        body.area = parseFloat(document.getElementById('opening-area').value) || 0;
        body.itemType = document.querySelector('input[name="opening-item-type"]:checked').value;
    } else {
        body.width = parseFloat(document.getElementById('opening-width').value) || 0;
        body.height = parseFloat(document.getElementById('opening-height').value) || 0;
        body.itemType = 'exclusion'; // doors and windows always exclude
    }
    
    let res = await authFetch(`${API}/api/room-openings`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(body)
    });
    let saved = await res.json();
    _roomOpenings.push(saved);
    
    // Re-open modal to show updated list
    await openOpeningModal(_currentOpeningType);
    renderCalculators();
    showToast(`${name} added`, 'success');
}

async function loadVendorShortlist() {
    let container = document.getElementById('view-shortlist');
    container.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Loading...</p>';
    
    let response = await authFetch(`${API}/api/vendor-shortlist/${projectId}`);
    let shortlist = await response.json();
    
    let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <span style="font-size:13px;color:var(--text-muted)">Vendors shortlisted for this project</span>
            <button class="add-btn" onclick="openVendorModal()" style="padding:7px 14px;font-size:12.5px">+ Add Vendor</button>
        </div>
    `;
    
    if (shortlist.length === 0) {
        html += '<p style="color:var(--text-muted);font-size:13px">No vendors shortlisted yet.</p>';
    } else {
        let statusColors = { 'Approved': '#2E4F42', 'Pending': '#8A6A2E', 'Rejected': '#C0392B' };
        html += '<table class="list-table"><thead><tr><th>Supplier</th><th>Category</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>';
        shortlist.forEach(function(vendor) {
            html += `<tr>
                <td style="font-weight:500">${vendor.supplierName}${vendor.category ? ` <span style="font-size:10.5px;color:var(--accent);background:var(--accent-glow);padding:2px 6px;border-radius:4px;margin-left:6px">${vendor.category}</span>` : ''}</td>
                <td style="color:var(--text-muted)">${vendor.category || '—'}</td>
                <td><span style="font-size:11px;font-weight:600;color:${statusColors[vendor.status]};background:${statusColors[vendor.status]}18;padding:3px 8px;border-radius:4px">${vendor.status}</span></td>
                <td style="color:var(--text-secondary)">${vendor.notes || '—'}</td>
                <td><button onclick="removeVendor(${vendor.id})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px" onmouseover="this.style.color='var(--destructive)'" onmouseout="this.style.color='var(--text-muted)'">✕</button></td>
            </tr>`;
        });
        html += '</tbody></table>';
    }
    
    container.innerHTML = html;
}

async function removeVendor(id) {
    await authFetch(`${API}/api/vendor-shortlist/${id}`, { method: 'DELETE' });
    loadVendorShortlist();
}

function openVendorModal() {
    document.getElementById('vendor-name').value = '';
    document.getElementById('vendor-category').value = '';
    document.getElementById('vendor-status').value = 'Pending';
    document.getElementById('vendor-notes').value = '';
    document.getElementById('vendor-modal').classList.add('open');
}

async function toggleOpening(id, active) {
    let opening = _roomOpenings.find(o => o.id === id);
    if (!opening) return;
    opening.active = active;
    await authFetch(`${API}/api/room-openings/${id}`, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify(opening)
    });
    renderCalculators();
}

async function deleteOpening(id) {
    await authFetch(`${API}/api/room-openings/${id}`, { method: 'DELETE', headers: authHeaders() });
    _roomOpenings = _roomOpenings.filter(o => o.id !== id);
    await openOpeningModal(_currentOpeningType);
    renderCalculators();
}

function getEffectiveArea(roomId) {
    let saved = localStorage.getItem('room-area-' + roomId);
    return saved !== null ? parseFloat(saved) : 0;
}

async function deleteRoom(id, name) {
    if (confirm(`Delete ${name || 'this room'}? This cannot be undone.`)) {
        await authFetch(`${API}/api/rooms/${id}`, { method: 'DELETE' });
        logActivity('Room Deleted', `Room "${name}" deleted`);
        loadLayout();
    }
}

document.getElementById('pin-modal-cancel').addEventListener('click', function() {
    document.getElementById('pin-modal').classList.remove('open');
});

document.getElementById('pin-modal-confirm').addEventListener('click', async function(e) {
    e.preventDefault();
    if (this._firing) return;
    this._firing = true;
    setTimeout(() => this._firing = false, 1000);
    let selected = document.querySelector('input[name="pin-product"]:checked');

document.getElementById('vendor-cancel').addEventListener('click', function() {
    document.getElementById('vendor-modal').classList.remove('open');
});

document.getElementById('vendor-confirm').addEventListener('click', async function() {
    let name = document.getElementById('vendor-name').value.trim();
    if (!name) { showToast('Please enter a supplier name', 'warning'); return; }
    
    await authFetch(`${API}/api/vendor-shortlist`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({
            projectId: parseInt(projectId),
            supplierName: name,
            category: document.getElementById('vendor-category').value,
            status: document.getElementById('vendor-status').value,
            notes: document.getElementById('vendor-notes').value.trim()
        })
    });
    
    document.getElementById('vendor-modal').classList.remove('open');
    loadVendorShortlist();
    showToast('Vendor added to shortlist', 'success');
});

switchView('layout');
updateCartCount();
