<!DOCTYPE html>
<html>
    <head>
        <title>Project details</title>
        <link rel="stylesheet" href="styles.css">
        <script src="cart.js"></script>
        <script src="auth.js"></script>
    </head>
<body>

    <div class="global-topbar">
        <div class="logo">Construct</div>
        <div style="display:flex;gap:10px;align-items:center;margin-left:auto">
            <a href="catalog.html" class="nav-btn">Catalog</a>
            <a href="index.html" class="nav-btn">Projects</a>
            <a href="boq-detail.html" class="nav-btn cart-btn"> BOQ <span id="cart-count">0</span></a>
        </div>
    </div>

    <div class="page-body">
        <div class="sidebar">
            <a href="index.html" class="nav-btn">← Projects</a>
            <button class="boq-nav-btn active" id="overview-btn" onclick="switchView('overview')">Overview</button>
<button class="boq-nav-btn" id="layout-btn" onclick="switchView('layout')">Layout</button>
<button class="boq-nav-btn" id="boq-btn" onclick="switchView('boq')">BOQ</button>
<button class="boq-nav-btn" id="shortlist-btn" onclick="switchView('shortlist')">Vendor Shortlist</button>
        </div>
        <div class="main-content">
            <div style="margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)">
                <h1 id="project-title" style="font-family:'Syne',sans-serif;margin-bottom:4px"></h1>
                <span id="project-subtitle" style="font-size:13px;color:var(--text-muted)"></span>
            </div>
            <div id="view-overview"></div>
            <div id="view-layout" style="display:none"></div>
            <div id="view-boq" style="display:none"></div>
            <div id="view-shortlist" style="display:none"></div>
        </div>
    </div>

    <div class="modal-overlay" id="room-modal">
        <div class="modal">
            <h2 id="room-modal-title">Add Room</h2>
            <input type="text" id="room-name" placeholder="Room name (e.g. Conference Room A)">
            <select id="room-type">
                <option value="">Room type</option>
                <option value="Office">Office</option>
                <option value="Conference">Conference</option>
                <option value="Reception">Reception</option>
                <option value="Kitchen">Kitchen</option>
                <option value="Bathroom">Bathroom</option>
                <option value="Co-Working">Co-Working</option>
                <option value="Storage">Storage</option>
                <option value="Corridor">Corridor</option>
                <option value="Other">Other</option>
            </select>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
                <input type="number" id="room-length" placeholder="Length (mm)">
                <input type="number" id="room-breadth" placeholder="Breadth (mm)">
                <input type="number" id="room-height" placeholder="Height (mm)">
            </div>
            <div class="modal-buttons">
                <button id="room-cancel">Cancel</button>
                <button id="room-confirm">Add Room</button>
            </div>
        </div>
    </div>

<script>
    let projectId = localStorage.getItem('selectedProjectId');
    let projectName = localStorage.getItem('selectedProjectName');

    function switchView(view) {
    if (view === 'boq') {
        localStorage.setItem('boqDefaultTab', 'boq');
        window.location.href = 'boq-detail.html';
        return;
    }
    if (view === 'shortlist') {
        localStorage.setItem('boqDefaultTab', 'shortlist');
        window.location.href = 'boq-detail.html';
        return;
    }

    ['overview', 'layout'].forEach(v => {
        document.getElementById('view-' + v).style.display = v === view ? 'block' : 'none';
    });
    document.querySelectorAll('.boq-nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(view + '-btn').classList.add('active');
    if (view === 'layout') loadLayout();
    if (view === 'overview') loadProjectDetails();
}

    async function loadProjectDetails() {
    let response = await fetch('https://construct-backend-production.up.railway.app/api/projects/' + projectId);
    let project = await response.json();
    document.getElementById('project-title').textContent = project.name;
    document.getElementById('project-subtitle').textContent = 
        (project.clientName || '') + 
        (project.location ? ' · ' + project.location : '') + 
        (project.squareFootage ? ' · ' + project.squareFootage + ' sqft' : '') +
        (project.budget ? ' · ₹' + Number(project.budget).toLocaleString('en-IN') : '');

    // Load rooms and vendors for overview stats
    let roomsRes = await fetch('https://construct-backend-production.up.railway.app/api/rooms/' + projectId);
    let rooms = await roomsRes.json();

    let cart = getCart();
    let boqValue = cart.reduce((sum, item) => sum + ((item.unitPrice || 0) * (item.quantity || 1)), 0);
    let confirmed = getConfirmed();
    let groups = {};
    cart.forEach(item => { let k = item.category || 'Other'; if (!groups[k]) groups[k] = true; });
    let totalCats = Object.keys(groups).length;
    let progress = totalCats > 0 ? Math.round((confirmed.length / totalCats) * 100) : 0;

    let shortlist = JSON.parse(localStorage.getItem('shortlist-' + projectId)) || [];

    document.getElementById('view-overview').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:32px">
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Total Budget</div>
                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">₹${project.budget ? (project.budget/10000000).toFixed(2) + ' Cr' : '—'}</div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">BOQ Value So Far</div>
                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">₹${(boqValue/10000000).toFixed(2)} Cr</div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Rooms</div>
                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">${rooms.length}</div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Shortlisted Vendors</div>
                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">${shortlist.length}</div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">BOQ Completion</div>
                <div style="font-size:22px;font-weight:700;color:var(--accent);font-family:'Syne',sans-serif">${progress}%</div>
                <div style="height:4px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden">
                    <div style="height:100%;width:${progress}%;background:var(--accent);border-radius:99px"></div>
                </div>
            </div>
        </div>
    `;
    let versions = JSON.parse(localStorage.getItem('versions-' + projectId)) || [];

    let versionsHtml = versions.length === 0 
    ? '<p style="font-size:13px;color:var(--text-muted)">No activity yet.</p>'
    : `<table class="list-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Update</th>
                <th>Remarks</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            ${versions.map(v => {
                let date = new Date(v.timestamp);
                let formatted = date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + 
                    ' · ' + date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                return `<tr>
                    <td style="color:var(--text-muted);white-space:nowrap;font-size:12px">${formatted}</td>
                    <td style="font-weight:500">${v.label}</td>
                    <td style="color:var(--text-muted)">${v.remarks || '—'}</td>
                    <td><button onclick="viewVersion('${v.id}')" 
                        style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;font-family:inherit">
                        View
                    </button></td>
                </tr>`;
            }).join('')}
        </tbody>
    </table>`;

    document.getElementById('view-overview').innerHTML += `
    <div style="margin-top:28px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">Version History</div>
            <button onclick="addManualActivity()" 
                style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-secondary);font-size:12px;font-family:inherit;cursor:pointer">
                + Add Activity
            </button>
        </div>
        ${versionsHtml}
    </div>
`;
}

// Auto-open room if returning from catalog
let returnToRoom = localStorage.getItem('addingToRoom');
if (returnToRoom) {
    localStorage.removeItem('addingToRoom');
    switchView('layout');
    // Wait for layout to load then open the room
    setTimeout(async function() {
        let response = await fetch('https://construct-backend-production.up.railway.app/api/rooms/single/' + returnToRoom);
        let room = await response.json();
        openRoomDetail(room);
    }, 500);
}

let currentFloor = 1;

async function loadLayout() {
    let drawingsRes = await fetch('https://construct-backend-production.up.railway.app/api/drawings/' + projectId);
    let allDrawings = await drawingsRes.json();
    
    let roomsRes = await fetch('https://construct-backend-production.up.railway.app/api/rooms/' + projectId);
    let allRooms = await roomsRes.json();

    let savedFloors = JSON.parse(localStorage.getItem('floors-' + projectId)) || [1];
    let floorList = [...new Set([...savedFloors, currentFloor])].sort((a, b) => a - b);

    let drawings = allDrawings.filter(d => parseInt(d.floorNumber) === parseInt(currentFloor));
    let rooms = allRooms.filter(r => parseInt(r.floorNumber) === parseInt(currentFloor));

    let layout = document.getElementById('view-layout');
    layout.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:12px">
                <span style="font-size:13px;font-weight:600;color:var(--text-primary)">Floor</span>
                <select id="floor-selector" onchange="currentFloor=parseInt(this.value);loadLayout()" 
                    style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text-primary)">
                    ${floorList.map(f => `<option value="${f}" ${f === currentFloor ? 'selected' : ''}>Floor ${f}</option>`).join('')}
                </select>
                <button onclick="addFloor(${Math.max(...floorList) + 1})" 
                    style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;font-family:inherit;font-size:12.5px;color:var(--text-secondary);cursor:pointer">
                    + Add Floor
                </button>
                ${currentFloor > 1 ? `
    <button onclick="deleteFloor(${currentFloor})"
        style="padding:6px 12px;border:1px solid var(--destructive);border-radius:6px;background:transparent;color:var(--destructive);font-size:12px;font-family:inherit;cursor:pointer">
        Delete Floor
    </button>
` : ''}
            </div>
            <div style="display:flex;gap:8px">
                ${drawings.length === 0 ? `
                    <label class="add-btn" style="font-size:12px;padding:6px 14px;cursor:pointer">
                        Upload Drawing
                        <input type="file" id="drawing-upload" accept="image/*,.pdf" style="display:none" 
                            onchange="uploadDrawing(this, ${currentFloor})">
                    </label>
                ` : `
                    <span style="font-size:12px;color:var(--text-muted);align-self:center">${drawings[0].displayName || 'Floor ' + currentFloor + ' drawing'}</span>
                    <label class="add-btn" style="font-size:12px;padding:6px 14px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text-secondary)">
                        Replace
                        <input type="file" id="drawing-upload" accept="image/*,.pdf" style="display:none"
                            onchange="uploadDrawing(this, ${currentFloor}, ${drawings[0].id})">
                    </label>
                    <button onclick="deleteDrawing(${drawings[0].id})" 
    style="padding:6px 12px;border:1px solid var(--destructive);border-radius:6px;background:transparent;color:var(--destructive);font-size:12px;font-family:inherit;cursor:pointer">
    Delete Drawing
</button>
                `}
                <button class="add-btn" onclick="openAddRoomModal()" style="font-size:12px;padding:6px 14px">+ Add Room</button>
            </div>
        </div>

        <div style="display:flex;gap:16px;height:calc(100vh - 260px)">
            
            <!-- Left: Drawing -->
            <div style="flex:1;border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;background:var(--surface)">
                ${drawings.length === 0 ? `
                    <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-muted)">
                        <div style="font-size:40px">📐</div>
                        <div style="font-size:13px">Upload a drawing for Floor ${currentFloor}</div>
                    </div>
                ` : drawings[0].fileName && drawings[0].fileName.toLowerCase().endsWith('.pdf') ? `
                    <iframe src="https://construct-backend-production.up.railway.app/api/files/${drawings[0].fileName}" 
                        style="width:100%;height:100%;border:none;display:block"></iframe>
                ` : `
    <div style="position:relative;width:100%;height:100%">
        <img id="drawing-img" style="width:100%;height:100%;object-fit:contain;display:block;cursor:crosshair">
        <div id="pins-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></div>
    </div>
`}
            </div>

            <!-- Right: Room List -->
            <div style="width:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px">
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">${rooms.length} room${rooms.length !== 1 ? 's' : ''} on Floor ${currentFloor}</div>
                <div id="room-list"></div>
            </div>
        </div>
    `;

    renderRoomList(rooms);

    if (drawings.length > 0 && drawings[0].fileName && !drawings[0].fileName.toLowerCase().endsWith('.pdf')) {
    requestAnimationFrame(function() {
        let img = document.getElementById('drawing-img');
        if (!img) return;
        
        if (img.complete && img.naturalWidth > 0) {
            renderPins(rooms);
            img.addEventListener('click', function(e) {
    let containerRect = this.getBoundingClientRect();
    let { offsetX, offsetY, renderedW, renderedH } = getImageRenderRect(this);
    
    let x = ((e.clientX - containerRect.left - offsetX) / renderedW) * 100;
    let y = ((e.clientY - containerRect.top - offsetY) / renderedH) * 100;
    
    // Clamp to image bounds
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    
    openAddRoomModal(x, y);
});

        } else {
            img.addEventListener('load', function() {
                renderPins(rooms);
                img.addEventListener('click', function(e) {
    let containerRect = this.getBoundingClientRect();
    let { offsetX, offsetY, renderedW, renderedH } = getImageRenderRect(this);
    
    let x = ((e.clientX - containerRect.left - offsetX) / renderedW) * 100;
    let y = ((e.clientY - containerRect.top - offsetY) / renderedH) * 100;
    
    // Clamp to image bounds
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    
    openAddRoomModal(x, y);
});
            });
        }
    });
    let proxyUrl = 'https://construct-backend-production.up.railway.app/api/files/proxy?url=' + encodeURIComponent(drawings[0].fileName);
console.log('fetching proxy:', proxyUrl);
fetch(proxyUrl)
    .then(r => {
        console.log('response status:', r.status);
        return r.blob();
    })
    .then(blob => {
        console.log('blob size:', blob.size);
        let blobUrl = URL.createObjectURL(blob);
        // Re-query the element in case DOM changed
        let img = document.getElementById('drawing-img');
        console.log('img after fetch:', img);
        if (img) {
            img.src = blobUrl;
            console.log('src set successfully');
        } else {
            console.log('img element gone - DOM was re-rendered');
        }
    })
    .catch(e => console.log('fetch error:', e));
    }
}

function getImageRenderRect(img) {
    let containerRect = img.getBoundingClientRect();
    let containerW = containerRect.width;
    let containerH = containerRect.height;
    let imgW = img.naturalWidth;
    let imgH = img.naturalHeight;
    
    let scale = Math.min(containerW / imgW, containerH / imgH);
    let renderedW = imgW * scale;
    let renderedH = imgH * scale;
    let offsetX = (containerW - renderedW) / 2;
    let offsetY = (containerH - renderedH) / 2;
    
    return { offsetX, offsetY, renderedW, renderedH };
}

function addFloor(floorNum) {
    currentFloor = floorNum;
    loadLayout();
}

async function uploadDrawing(input, floorNumber, existingId) {
    let file = input.files[0];
    if (!file) return;

    let remarks = '';
    if (existingId) {
        remarks = prompt('Why is this drawing being replaced? (optional)') || '';
    }

    if (existingId) {
        await fetch('https://construct-backend-production.up.railway.app/api/drawings/' + existingId, { method: 'DELETE' });
    }

    let formData = new FormData();
    formData.append('file', file);

    let uploadRes = await fetch('https://construct-backend-production.up.railway.app/api/files/upload', {
        method: 'POST',
        body: formData
    });
    let fileName = await uploadRes.text();

    let today = new Date().toISOString().split('T')[0];
    await fetch('https://construct-backend-production.up.railway.app/api/drawings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            projectId: parseInt(projectId),
            fileName: fileName,
            displayName: 'Floor ' + floorNumber + ' Drawing',
            uploadedAt: today,
            floorNumber: floorNumber
        })
    });

    createVersion(
        existingId ? 'Drawing replaced on Floor ' + floorNumber : 'Drawing uploaded on Floor ' + floorNumber,
        remarks
    );
    loadLayout();
}

async function deleteDrawing(id) {
    if (confirm('Delete this drawing? This cannot be undone.')) {
        await fetch('https://construct-backend-production.up.railway.app/api/drawings/' + id, { method: 'DELETE' });
        createVersion('Drawing deleted on Floor ' + currentFloor);
        loadLayout();
    }
}

async function deleteFloor(floorNum) {
    if (confirm('Delete Floor ' + floorNum + '? All rooms and drawings on this floor will be deleted.')) {
        // Delete all rooms on this floor
        let roomsRes = await fetch('https://construct-backend-production.up.railway.app/api/rooms/' + projectId);
        let allRooms = await roomsRes.json();
        let floorRooms = allRooms.filter(r => parseInt(r.floorNumber) === floorNum);
        for (let room of floorRooms) {
            await fetch('https://construct-backend-production.up.railway.app/api/rooms/' + room.id, { method: 'DELETE' });
        }

        // Delete all drawings on this floor
        let drawingsRes = await fetch('https://construct-backend-production.up.railway.app/api/drawings/' + projectId);
        let allDrawings = await drawingsRes.json();
        let floorDrawings = allDrawings.filter(d => parseInt(d.floorNumber) === floorNum);
        for (let drawing of floorDrawings) {
            await fetch('https://construct-backend-production.up.railway.app/api/drawings/' + drawing.id, { method: 'DELETE' });
        }

        // Remove from localStorage floors list
        let floors = JSON.parse(localStorage.getItem('floors-' + projectId)) || [1];
        floors = floors.filter(f => f !== floorNum);
        localStorage.setItem('floors-' + projectId, JSON.stringify(floors));

        // Go back to floor 1
        currentFloor = 1;
        loadLayout();
    }
}

function addManualActivity() {
    let label = prompt('Enter Activity');
    if (!label) return;
    let remarks = prompt('Any remarks or notes? (optional)');
    createVersion(label, remarks || '');
    loadProjectDetails();
}

function viewVersion(versionId) {

                ← Back to Overview

            <span style="font-size:14px;font-weight:600;color:var(--text-primary)">${version.label}</span>
            <span style="font-size:12px;color:var(--text-muted)">${date}</span>
            <span style="font-size:11px;background:var(--surface-raised);color:var(--text-muted);padding:2px 8px;border-radius:4px;margin-left:4px">Read only</span>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">BOQ Items</div>
                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">${cart.length}</div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">BOQ Value</div>
                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">₹${(grandTotal/10000000).toFixed(2)} Cr</div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px">
                <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Confirmed Categories</div>
                <div style="font-size:22px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">${confirmed.length}</div>
            </div>
        </div>

        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">BOQ at this point</div>
        <table class="list-table" style="margin-bottom:24px">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Qty</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                </tr>
            </thead>

// Calculator functions
function calcPaint() {
    let area = parseFloat(document.getElementById('area-input').value) || 0;
    let wallArea = parseFloat(document.getElementById('wall-area-value').value) || 0;
    let coats = parseFloat(document.getElementById('paint-coats').value) || 2;
    let coverage = parseFloat(document.getElementById('paint-coverage').value) || 120;
    let litres = (wallArea * coats) / coverage;
    document.getElementById('paint-result').textContent = 
        litres > 0 ? `${litres.toFixed(1)} litres — approx ${Math.ceil(litres / 4)} × 4L cans` : 'Enter valid dimensions first';
}

function calcFlooring() {
    let area = parseFloat(document.getElementById('area-input').value) || 0;
    let tileSize = parseFloat(document.getElementById('floor-tile').value) || 600;
    let wastage = parseFloat(document.getElementById('floor-wastage').value) || 10;
    let tileSqft = (tileSize / 304.8) * (tileSize / 304.8);
    let tiles = area > 0 ? Math.ceil((area * (1 + wastage / 100)) / tileSqft) : 0;
    document.getElementById('floor-result').textContent = 
        tiles > 0 ? `${tiles} tiles needed (${tileSize}×${tileSize}mm with ${wastage}% wastage)` : 'Enter valid dimensions first';
}

async function updateRoomDimension(roomId, field, value) {
    let response = await fetch('https://construct-backend-production.up.railway.app/api/rooms/single/' + roomId);
    let room = await response.json();
    room[field] = parseFloat(value);
    
    // Recalculate area and wall area
    if (room.length && room.breadth) {
        let newArea = ((room.length * room.breadth) / 92903).toFixed(1);
        localStorage.setItem('room-area-' + roomId, newArea);
        let areaInput = document.getElementById('area-input');
        if (areaInput) areaInput.value = newArea;
    }
    
    await fetch('https://construct-backend-production.up.railway.app/api/rooms/' + roomId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(room)
    });
}

function calcCeiling() {
    let area = parseFloat(document.getElementById('area-input').value) || 0;
    let length = parseFloat(document.getElementById('room-length-val').value) || 0;
    let breadth = parseFloat(document.getElementById('room-breadth-val').value) || 0;
    let tiles = Math.ceil(area);
    let perimeterMm = 2 * (length + breadth);
    let edgeTrim = perimeterMm > 0 ? Math.ceil(perimeterMm / (600 * 304.8)) : 0;
    document.getElementById('ceiling-result').textContent = 
        area > 0 ? `${tiles} sqft tiles + ${edgeTrim} rft edge trim` : 'Enter valid dimensions first';
}

function getEffectiveArea(roomId) {
    let saved = localStorage.getItem('room-area-' + roomId);
    return saved !== null ? parseFloat(saved) : 0;
}

async function deleteRoom(id) {
    if (confirm('Delete this room? This cannot be undone.')) {
        await fetch('https://construct-backend-production.up.railway.app/api/rooms/' + id, { method: 'DELETE' });
        createVersion(name + ' deleted');
        loadLayout();
    }
}

document.getElementById('room-cancel').addEventListener('click', function() {
    document.getElementById('room-modal').classList.remove('open');
});

document.getElementById('room-confirm').addEventListener('click', async function() {
    let name = document.getElementById('room-name').value.trim();
