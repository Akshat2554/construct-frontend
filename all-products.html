<!DOCTYPE html>
<html>
    <head>
        <title>All products</title>
        <link rel="stylesheet" href="styles.css">
        <script src="auth.js"></script>
        <script src="api.js"></script>
        <script src = "cart.js"></script>   

    </head>
    <body>
        <div class="global-topbar">
            <div class="logo">Construct</div>
            <button class="nav-btn" id="project-selector-btn"> <span id="topbar-project-name">No project</span></button>

            <div class="search-box">
                <input type="text" placeholder="Search Products">
            </div>

            <div style="display:flex;gap:10px;align-items:center;margin-left:auto">
                <a href="catalog.html" class="nav-btn active">Catalog</a>
                <a href="index.html" class="nav-btn">Projects</a>
                <a href="boq-detail.html" class="nav-btn"> BOQ <span id="cart-count">0</span></a>
            </div>
        </div>

        <div class="page-body">
            <div class="sidebar">
                <a href="suppliers.html" class="back-btn">← Back to suppliers</a>
            </div>

            <div class="main-content">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
                    <h1 id="category-title" style="margin-bottom:0">Products</h1>
                    <div class="view-toggle">
                        <button id="grid-view-btn" class="view-toggle-btn active" onclick="setView('grid')">⊞ Grid</button>
                        <button id="list-view-btn" class="view-toggle-btn " onclick="setView('list')">☰ List</button>
                    </div>
                </div>
                <div class="product-grid" id="product-grid"></div>
            </div>
        </div>

        <div class="modal-overlay" id="project-modal">
            <div class="modal">
                <h2>Select Project</h2>
                <div id="project-list-modal"></div>
                <div class="modal-buttons">
                    <button id="project-modal-close">Close</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="product-detail-modal">
            <div class="modal" style="width:580px;max-width:95vw">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
                    <h2 id="pd-name" style="font-size:18px;max-width:480px"></h2>
                    <button onclick="document.getElementById('product-detail-modal').classList.remove('open')"
                        style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);flex-shrink:0">✕</button>
                </div>
        
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
                    <div>
                        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">Brand</div>
                        <div id="pd-brand" style="font-size:13.5px;color:var(--text-primary)"></div>
                    </div>
                    <div>
                        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">Code</div>
                        <div id="pd-code" style="font-size:13.5px;color:var(--text-primary)"></div>
                    </div>
                    <div>
                        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">Dimensions</div>
                        <div id="pd-dimensions" style="font-size:13.5px;color:var(--text-primary)"></div>
                    </div>
                    <div>
                        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">Unit</div>
                        <div id="pd-unit" style="font-size:13.5px;color:var(--text-primary)"></div>
                    </div>
                    <div>
                        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">Availability</div>
                        <div id="pd-availability" style="font-size:13.5px;color:var(--text-primary)"></div>
                    </div>
                    <div>
                        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">Price</div>
                        <div id="pd-price" style="font-size:18px;font-weight:700;color:var(--accent)"></div>
                    </div>
                </div>
        
                <div id="pd-description-section" style="display:none;margin-bottom:16px">
                    <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Description / Specification</div>
                    <div id="pd-description" style="font-size:13px;color:var(--text-secondary);line-height:1.7;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;white-space:pre-wrap;max-height:200px;overflow-y:auto"></div>
                </div>
        
                <div class="modal-buttons">
                    <button onclick="document.getElementById('product-detail-modal').classList.remove('open')" 
                        id="pd-cancel">Close</button>
                    <button id="pd-add-btn" class="add-btn">Add to BOQ</button>
                </div>
            </div>
        </div>

        <script src="topbar.js"></script>
        <script>
            let currentView = localStorage.getItem('productView') || 'grid';
            let categoryId = localStorage.getItem('selectedCategoryId');
            let categoryName = localStorage.getItem('selectedCategoryName');
            document.getElementById('category-title').textContent = categoryName + ' - All Products';

            async function loadAllProducts() {
                let productsResponse = await authFetch('https://construct-backend-production.up.railway.app/api/products/by-category/' + categoryId);
                let products = await productsResponse.json();

                let grid = document.querySelector('.product-grid');
                grid.innerHTML = '';

                if (products.length > 0) {
                    let header = document.createElement('div');
                    header.style.cssText = 'grid-column:1/-1;font-size:15px;font-weight:600;color:#1a1f2e;margin:16px 0 8px';
                    header.textContent = 'Products';
                    grid.appendChild(header);

                    if(currentView === 'list') {
                        renderProductsList(grid,products);
                    }
                    else {
                        renderProductsGrid(grid,products);
                    }
                }

                if (products.length === 0) {
                grid.innerHTML = '<p style="color:#64748b;padding:20px">No catalogs or products uploaded yet.</p>';
            }
            }

            function setView(view) {
                currentView = view;
                localStorage.setItem('productView', view);
                document.getElementById('grid-view-btn').classList.toggle('active', view === 'grid');
                document.getElementById('list-view-btn').classList.toggle('active', view === 'list');
                loadAllProducts();
            }

            function addToCartPayload(product) {
            return `addToCart({
                productId: ${product.id},
                name: '${product.name}',
                productNumber: '${product.productNumber || ''}',
                supplierName: '${product.supplierId || ''}',
                category: '${categoryName}',
                unit: '${product.unit || ''}',
                unitPrice: ${product.price},
                quantity: 1,
                totalPrice: ${product.price}
            })`;
        }

        async function renderProductsGrid(grid, products) {
            window._renderedProducts = products;
    let cart = await getCart(); // fetch once
    
    let cardRow = document.createElement('div');
    cardRow.style.cssText = 'grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px';
    grid.appendChild(cardRow);

    products.forEach(function(product) {
        let qty = cart.filter(i => i.productId === product.id)
                      .reduce((sum, i) => sum + (i.quantity || 0), 0);
        
        let card = document.createElement('div');
        card.className = 'product-tile-card';
        card.innerHTML = `
            <div class="product-tile-image">
                ${product.imageURL
                    ? `<img src="${product.imageURL}" alt="${product.name}">`
                    : `<div class="product-tile-placeholder">📦</div>`}
            </div>
            <div class="product-tile-body">
                <div class="product-tile-name">${product.name}</div>
                <div class="product-tile-row"><span>Brand</span><span>${product.brandName || '—'}</span></div>
                <div class="product-tile-row"><span>Code</span><span>${product.productNumber || '—'}</span></div>
                <div class="product-tile-row"><span>Dimensions</span><span>${product.dimensions || '—'}</span></div>
                <div class="product-tile-row"><span>Unit</span><span>${product.unit || '—'}</span></div>
                <div class="product-tile-row"><span>Availability</span><span>${product.availability || '—'}</span></div>
                <div class="product-tile-footer">
                    <div class="product-tile-price">₹${product.price}</div>
                    ${!product.name || !product.unit || !product.price 
                        ? `<button disabled title="Missing name, unit, or price" 
                            style="width:28px;height:28px;border-radius:50%;background:var(--border);color:var(--text-muted);border:none;font-size:18px;cursor:not-allowed;display:flex;align-items:center;justify-content:center">+</button>`
                        : `<div data-product-id="${product.id}">${buildCartControl(product.id, qty)}</div>`
                    }
                </div>
            </div>
        `;
        card.style.cursor = 'pointer';
        card.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            openProductDetail(product);
        });
        cardRow.appendChild(card);
    });
}

        document.querySelector('.search-box input').addEventListener('input', function() {
    let query = this.value.toLowerCase().trim();
    
    // List view — filter table rows
    let rows = document.querySelectorAll('#products-tbody tr');
    rows.forEach(function(row) {
        let text = row.textContent.toLowerCase();
        row.style.display = text.includes(query) ? '' : 'none';
    });

    // Grid view — filter product cards
    let cards = document.querySelectorAll('.product-tile-card');
    cards.forEach(function(card) {
        let text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? '' : 'none';
    });
});

function buildCartControl(productId, qty) {
    let roomId = localStorage.getItem('addingToRoom');
    if (roomId) {
        return `<button class="add-to-cart-btn" 
            onclick="event.stopPropagation(); handleAddToCart(${productId})">+</button>`;
    }
    if (qty > 0) {
        return `
            <div style="display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:6px;overflow:hidden" onclick="event.stopPropagation()">
                <button onclick="handleDecrease(${productId})"
                    style="width:28px;height:28px;border:none;background:transparent;color:var(--text-secondary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center"
                    onmouseover="this.style.background='var(--bg)'"
                    onmouseout="this.style.background='transparent'">−</button>
                <input type="number" value="${qty}" min="1"
                    style="width:36px;height:28px;border:none;text-align:center;font-family:inherit;font-size:13px;font-weight:600;color:var(--text-primary);background:transparent;outline:none;-moz-appearance:textfield;appearance:textfield"
                    onchange="handleQtyInput(${productId}, this.value)"
                    onclick="event.stopPropagation()">
                <button onclick="handleIncrease(${productId})"
                    style="width:28px;height:28px;border:none;background:transparent;color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center"
                    onmouseover="this.style.background='var(--bg)'"
                    onmouseout="this.style.background='transparent'">+</button>
            </div>
        `;
    }
    return `<button class="add-to-cart-btn" 
        onclick="event.stopPropagation(); handleAddToCart(${productId})">+</button>`;
}

async function handleIncrease(productId) {
    if (!_cartCache) _cartCache = await getCart();
    let item = _cartCache.find(i => i.productId === productId);
    if (item) {
        item.quantity += 1;
        document.querySelectorAll(`[data-product-id="${productId}"] input`).forEach(el => el.value = item.quantity);
        updateCartCountFromCache();
        fetch(`${API}/api/boq/${item.id}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify(item)
        });
    }
}

async function handleDecrease(productId) {
    if (!_cartCache) _cartCache = await getCart();
    let item = _cartCache.find(i => i.productId === productId);
    if (!item) return;
    if (item.quantity <= 1) {
        _cartCache = _cartCache.filter(i => i.productId !== productId);
        document.querySelectorAll(`[data-product-id="${productId}"]`).forEach(el => {
            el.innerHTML = buildCartControl(productId, 0);
        });
        updateCartCountFromCache();
        fetch(`${API}/api/boq/${item.id}`, { method: 'DELETE', headers: authHeaders() });
    } else {
        item.quantity -= 1;
        document.querySelectorAll(`[data-product-id="${productId}"] input`).forEach(el => el.value = item.quantity);
        updateCartCountFromCache();
        fetch(`${API}/api/boq/${item.id}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify(item)
        });
    }
}

async function handleQtyInput(productId, value) {
    let qty = parseInt(value);
    if (isNaN(qty) || qty < 1) return;
    if (!_cartCache) _cartCache = await getCart();
    let item = _cartCache.find(i => i.productId === productId);
    if (item) {
        item.quantity = qty;
        updateCartCountFromCache();
        fetch(`${API}/api/boq/${item.id}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify(item)
        });
    }
}

async function renderProductsList(grid, products) {
    window._renderedProducts = products;
    let cart = await getCart(); // fetch once
    
    let table = document.createElement('table');
    table.className = 'list-table';
    table.innerHTML = `
        <thead>
            <tr>
                <th></th>
                <th>Name</th>
                <th>Brand</th>
                <th>Code</th>
                <th>Dimensions</th>
                <th>Unit</th>
                <th>Availability</th>
                <th>Price</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="products-tbody"></tbody>
    `;
    grid.appendChild(table);

    let tbody = document.getElementById('products-tbody');

    products.forEach(function(product) {
        let qty = cart.filter(i => i.productId === product.id)
                      .reduce((sum, i) => sum + (i.quantity || 0), 0);

        let row = document.createElement('tr');
        row.style.cursor = 'pointer';
        row.innerHTML = `
            <td>
                ${product.imageURL
                    ? `<img src="${product.imageURL}" alt="${product.name}" class="list-thumb">`
                    : `<div class="list-thumb-placeholder">📦</div>`}
            </td>
            <td style="font-weight:500">${product.name}</td>
            <td>${product.brandName || '—'}</td>
            <td>${product.productNumber || '—'}</td>
            <td>${product.dimensions || '—'}</td>
            <td>${product.unit || '—'}</td>
            <td>${product.availability || '—'}</td>
            <td style="color:var(--accent);font-weight:600">₹${product.price}</td>
            <td><button class="dots-btn" onclick="event.stopPropagation(); editProduct(${product.id})">⋮</button></td>
            <td><div data-product-id="${product.id}">${buildCartControl(product.id, qty)}</div></td>
        `;
        row.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            openProductDetail(product);
        });
        tbody.appendChild(row);
    });
}

        async function getCartQuantity(productId) {
    let cart = await getCart();
    let item = cart.find(i => i.productId === productId);
    return item ? item.quantity : 0;
}

async function handleAddToCart(productId) {
    let product = window._renderedProducts.find(p => p.id === productId);
    if (!product) return;
    
    let roomId = localStorage.getItem('addingToRoom');
    
    if (roomId) {
        await addToRoomShortlist(product.id, product.name, product.price, product.unit || '', roomId);
    } else {
        let payload = addToCartPayload(product);
        eval(payload);
        alert(product.name + ' added to BOQ');
    }
    
    // Update button to green checkmark
    document.querySelectorAll(`[data-product-id="${productId}"]`).forEach(el => {
        el.innerHTML = buildCartControl(productId, 1);
    });
    updateCartCount();
}

function openProductDetail(product) {
    document.getElementById('pd-name').textContent = product.name || '—';
    document.getElementById('pd-brand').textContent = product.brandName || '—';
    document.getElementById('pd-code').textContent = product.productNumber || '—';
    document.getElementById('pd-dimensions').textContent = product.dimensions || '—';
    document.getElementById('pd-unit').textContent = product.unit || '—';
    document.getElementById('pd-availability').textContent = product.availability ? product.availability + ' nos' : '—';
    document.getElementById('pd-price').textContent = product.price ? '₹' + Number(product.price).toLocaleString('en-IN') : '—';
    
    let descSection = document.getElementById('pd-description-section');
    let descEl = document.getElementById('pd-description');
    if (product.description && product.description.trim()) {
        descEl.textContent = product.description;
        descSection.style.display = 'block';
    } else {
        descSection.style.display = 'none';
    }

    document.getElementById('pd-add-btn').onclick = function() {
    let payload = addToCartPayload(product);
    eval(payload);
    document.getElementById('product-detail-modal').classList.remove('open');
    loadAllProducts();
};

    document.getElementById('product-detail-modal').classList.add('open');
}

        loadAllProducts();
        updateCartCount();
        </script>
    </body>
</html>
