<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog — Construct</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <script src="auth.js?v=2"></script>
    <script src="toast.js?v=2"></script>
    <script src="ui.js?v=2"></script>
    <script src="api.js?v=2"></script>
    <script src="cart.js?v=2"></script>

</head>
<body>
    <div class="page-body">
        <div class="main-content" style="flex:1">
            <div class="page-header">
                <h1>Product catalog</h1>
                <div class="search-box">
                    <input type="search" placeholder="Search categories" aria-label="Search categories">
                </div>
                <button class="add-btn" id="add-btn">+ Add category</button>
            </div>
            <div class="category-grid" id="category-grid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">New Category</h2>
            <label class="field"><span class="field-label">Name</span><input type="text" id="cat-name" placeholder="e.g. Flooring"></label>
            <label class="field"><span class="field-label">Description</span><input type="text" id="cat-desc" placeholder="What goes in this category"></label>
            <div class="modal-buttons">
                <button id="delete-category-btn" class="delete-btn" style="display:none">Delete</button>
                <button id="cancel-btn">Cancel</button>
                <button id="confirm-btn">Add</button>
            </div>
        </div>
    </div>
    </div>

    <script src="topbar.js?v=2"></script>
    <script>
        let editingId = null;
        let _categoriesById = {};

async function loadCategories() {
    let response = await authFetch('https://construct-backend-production.up.railway.app/api/categories');
    let categories = await response.json();
    let grid = document.querySelector('.category-grid');
    grid.innerHTML = '';
    _categoriesById = {};
    categories.forEach(function(cat) { _categoriesById[cat.id] = cat; });
    if (!categories.length) {
        grid.innerHTML = '<div class="empty-state card" style="grid-column:1/-1"><strong>No categories yet</strong>Add a category such as Flooring or Lighting to start building the catalog.</div>';
        return;
    }
    categories.forEach(function(cat) {
        renderCategories(cat);
    });
}

function renderCategories(cat) {
    let grid = document.querySelector('.category-grid');
    let card = document.createElement('div');
    card.classList.add('category-tile');
    card.style.cursor = 'pointer';
    card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div class="tile-title">${escapeHtml(cat.name)}</div>
            <button aria-label="Edit category" title="Edit category" class="dots-btn" onclick="event.stopPropagation(); editCategory(${cat.id})"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        </div>
        <div class="tile-desc">${cat.description ? escapeHtml(cat.description) : '<span class="text-muted">No description</span>'}</div>
    `;

    card.dataset.clickable = '';

    card.addEventListener('click', function() {
    localStorage.setItem('selectedCategoryId', cat.id);
    localStorage.setItem('selectedCategoryName', cat.name);
    window.location.href = 'suppliers.html';
});

    grid.appendChild(card);
}

async function deleteCategory(id) {
    await authFetch('https://construct-backend-production.up.railway.app/api/categories/' + id, {
        method: 'DELETE'
    });
    loadCategories();
}

async function getCartQuantity(productId) {
    let cart = await getCart();
    let item = cart.find(i => i.productId === productId);
    return item ? item.quantity : 0;
}

function editCategory(id) {
    let cat = _categoriesById[id] || {};
    let currentName = cat.name || '';
    let currentDescription = cat.description || '';
    editingId = id;
    document.getElementById('cat-name').value = currentName;
    document.getElementById('cat-desc').value = currentDescription;
    document.getElementById('modal-title').textContent = 'Edit Category';
    document.getElementById('confirm-btn').textContent = 'Save';
    document.getElementById('delete-category-btn').style.display = 'inline-flex';
    modal.classList.add('open');
}

let modal = document.getElementById('modal-overlay');
let addBtn = document.getElementById('add-btn');
let cancelBtn = document.getElementById('cancel-btn');
let confirmBtn = document.getElementById('confirm-btn');

addBtn.addEventListener('click', function() {
    editingId = null;
    document.getElementById('cat-name').value = '';
    document.getElementById('cat-desc').value = '';
    document.getElementById('modal-title').textContent = 'New Category';
    document.getElementById('confirm-btn').textContent = 'Add';
    document.getElementById('delete-category-btn').style.display = 'none';
    modal.classList.add('open');
});

cancelBtn.addEventListener('click', function() {
    modal.classList.remove('open');
    editingId = null;
});

document.querySelector('.search-box input').addEventListener('input', function() {
    let query = this.value.toLowerCase().trim();
    let tiles = document.querySelectorAll('.category-tile');
    tiles.forEach(function(tile) {
        let title = tile.querySelector('.tile-title').textContent.toLowerCase();
        let desc = tile.querySelector('.tile-desc').textContent.toLowerCase();
        tile.style.display = (title.includes(query) || desc.includes(query)) ? 'block' : 'none';
    });
});

confirmBtn.addEventListener('click', async function() {
    let name = document.getElementById('cat-name').value.trim();
    let desc = document.getElementById('cat-desc').value.trim();

    if (name === '') {
        showToast('Please enter a category name', 'error');
        return;
    }

    if (editingId) {
        await authFetch('https://construct-backend-production.up.railway.app/api/categories/' + editingId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, description: desc })
        });
    } else {
        await authFetch('https://construct-backend-production.up.railway.app/api/categories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, description: desc })
        });
    }

    modal.classList.remove('open');
    editingId = null;
    loadCategories();

    document.getElementById('delete-category-btn').addEventListener('click', async function() {
    if (await uiConfirm('Delete this category? This cannot be undone.')) {
        await authFetch('https://construct-backend-production.up.railway.app/api/categories/' + editingId, {
            method: 'DELETE'
        });
        modal.classList.remove('open');
        editingId = null;
        loadCategories();
    }
});
});



loadCategories();
updateCartCount();
    </script>
</body>
</html>
