<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Construct</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="auth.js?v=2"></script>
    <script src="toast.js?v=2"></script>
    <script src="ui.js?v=2"></script>
    <script src="api.js?v=2"></script>
    <script src="cart.js?v=2"></script>

</head>
<body>

    <div class="page-body">
        <div class="main-content">
            <div class="page-header">
                <h1>Projects</h1>
                <button class="add-btn" id="add-btn">+ New project</button>
            </div>
            <div class="filter-bar">
                <select id="filter-status" onchange="loadProjects()" aria-label="Filter by status">
                    <option value="">All statuses</option>
                    <option value="Active">Active</option>
                    <option value="On Hold">On hold</option>
                    <option value="Completed">Completed</option>
                </select>
                <select id="filter-priority" onchange="loadProjects()" aria-label="Filter by priority">
                    <option value="">All priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
                <select id="sort-projects" onchange="loadProjects()" aria-label="Sort projects">
                    <option value="">Sort: default</option>
                    <option value="priority-high">Priority: high first</option>
                    <option value="priority-low">Priority: low first</option>
                    <option value="name">Name A–Z</option>
                    <option value="budget-high">Budget: high first</option>
                </select>
            </div>
            <div id="projects-container"><div class="skeleton card" role="status" aria-label="Loading"><div class="skel-row"><span class="skel" style="width:62%"></span><span class="skel skel-sm" style="width:28%"></span></div><div class="skel-row"><span class="skel" style="width:48%"></span><span class="skel skel-sm" style="width:22%"></span></div><div class="skel-row"><span class="skel" style="width:56%"></span><span class="skel skel-sm" style="width:30%"></span></div></div></div>
        </div>
    </div>

    <!-- Add/Edit Project Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" style="width:620px;max-width:95vw">
            <h2 id="modal-title">New Project</h2>
            
            <div class="form-grid">
                <label class="field"><span class="field-label">Project name</span><input type="text" id="proj-name" placeholder="e.g. HTC office fit-out"></label>
                <label class="field"><span class="field-label">Client</span><input type="text" id="proj-clientName" placeholder="Client name"></label>
                <label class="field"><span class="field-label">Site location</span><input type="text" id="proj-location" placeholder="e.g. Whitefield, Bengaluru"></label>
                <div class="form-grid-2">
                    <label class="field"><span class="field-label">Status</span>
                        <select id="proj-status">
                            <option value="">Not set</option>
                            <option value="Active">Active</option>
                            <option value="On Hold">On hold</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </label>
                    <label class="field"><span class="field-label">Priority</span>
                        <select id="proj-priority">
                            <option value="">Not set</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </label>
                </div>
                <label class="field"><span class="field-label">Budget</span>
                    <span class="input-affix"><span class="affix-left">₹</span><input type="number" id="proj-budget" inputmode="decimal" placeholder="0" style="padding-left:26px;width:100%"></span>
                </label>
                <label class="field"><span class="field-label">Area</span>
                    <span class="input-affix"><input type="number" id="proj-sft" inputmode="decimal" placeholder="0" style="padding-right:44px;width:100%"><span class="affix-right">sqft</span></span>
                </label>
                <label class="field"><span class="field-label">Start date</span><input type="date" id="proj-startDate"></label>
                <label class="field"><span class="field-label">End date</span><input type="date" id="proj-endDate"></label>
            </div>
    
            <div class="modal-buttons" style="margin-top:16px">
                <button id="delete-project-btn" class="delete-btn" style="display:none">Delete</button>
                <button id="cancel-btn">Cancel</button>
                <button id="confirm-btn">Create</button>
            </div>
        </div>
    </div>

    <!-- Manage Access Modal (admin only) -->
    <div class="modal-overlay" id="access-modal">
        <div class="modal" style="width:420px">
            <h2>Manage Access</h2>
            <p class="text-13 text-muted">Who can see and work on this project.</p>
            <div id="access-user-list" style="max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px"></div>
            <div class="modal-buttons">
                <button id="access-modal-close">Done</button>
            </div>
        </div>
    </div>
    </div>

    <script src="topbar.js?v=2"></script>
    <script>
        let editingId = null;
        document.getElementById('add-btn').style.display = isAdmin() ? '' : 'none';

        const statusColors = {
            'Active': '#355E45',
            'On Hold': '#7A5C22',
            'Completed': '#6B6963'
        };

        const priorityColors = {
            'High': '#B3362B',
            'Medium': '#7A5C22',
            'Low': '#355E45'
        };

        async function loadProjects() {
    let response = await authFetch('https://construct-backend-production.up.railway.app/api/projects');
    let projects = await response.json();
    
    // Filter and sort first
    let statusFilter = document.getElementById('filter-status').value;
    let priorityFilter = document.getElementById('filter-priority').value;
    let sortValue = document.getElementById('sort-projects').value;
    if (statusFilter) projects = projects.filter(p => p.status === statusFilter);
    if (priorityFilter) projects = projects.filter(p => p.priority === priorityFilter);
    const priorityOrder = { 'High': 1, 'Medium': 2, 'Low': 3 };
    if (sortValue === 'priority-high') projects.sort((a, b) => (priorityOrder[a.priority] || 99) - (priorityOrder[b.priority] || 99));
    if (sortValue === 'priority-low') projects.sort((a, b) => (priorityOrder[b.priority] || 99) - (priorityOrder[a.priority] || 99));
    if (sortValue === 'name') projects.sort((a, b) => a.name.localeCompare(b.name));
    if (sortValue === 'budget-high') projects.sort((a, b) => (b.budget || 0) - (a.budget || 0));

    let container = document.getElementById('projects-container');
    container.innerHTML = '';

    if (projects.length === 0) {
        container.innerHTML = (statusFilter || priorityFilter)
            ? '<div class="empty-state card"><strong>No projects match these filters</strong>Change the status or priority filter to see more.</div>'
            : (isAdmin()
                ? '<div class="empty-state card"><strong>No projects yet</strong>Create a project to start measuring rooms and building its BOQ.</div>'
                : '<div class="empty-state card"><strong>No projects assigned to you</strong>Ask an admin to give you access to a project.</div>');
        return;
    }

    // Fetch all data in parallel for all projects
    let [allBoqResults, allConfirmedResults] = await Promise.all([
        Promise.all(projects.map(p => 
            authFetch(`https://construct-backend-production.up.railway.app/api/boq/${p.id}`).then(r => r.json())
        )),
        Promise.all(projects.map(p => 
            authFetch(`https://construct-backend-production.up.railway.app/api/confirmed-categories/${p.id}`).then(r => r.json())
        ))
    ]);

    projects.forEach(function(project, index) {
        let boqItems = allBoqResults[index];
        let confirmedItems = allConfirmedResults[index];
        
        let groups = {};
        boqItems.forEach(item => { let k = item.category || 'Other'; if (!groups[k]) groups[k] = true; });
        let totalCats = Object.keys(groups).length;
        let confirmedCatsCount = confirmedItems.length;
        let progress = totalCats > 0 ? Math.round((confirmedCatsCount / totalCats) * 100) : 0;

        // render card
        let card = document.createElement('div');
        card.className = 'project-card card';
        let safeName = (project.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        let statusBadge = project.status ? `<span class="badge" style="color:${statusColors[project.status] || 'var(--text-secondary)'};background:${(statusColors[project.status] || '#6B6963')}1A">${escapeHtml(project.status)}</span>` : '';
        let priorityBadge = project.priority ? `<span class="badge" style="color:${priorityColors[project.priority] || 'var(--text-secondary)'};background:${(priorityColors[project.priority] || '#6B6963')}1A">${escapeHtml(project.priority)} priority</span>` : '';
        let facts = [];
        if (project.squareFootage) facts.push(['Area', Number(project.squareFootage).toLocaleString('en-IN') + ' sqft']);
        if (project.budget && !isVisualizer()) facts.push(['Budget', formatINR(project.budget)]);
        if (project.startDate) facts.push(['Timeline', project.startDate + ' – ' + (project.endDate || 'open')]);
        card.innerHTML = `
    <div class="project-main" onclick="selectProject(${project.id}, '${safeName}')" aria-label="Open ${escapeHtml(project.name)}">
        <div class="project-title-row">
            <h2 class="project-name">${escapeHtml(project.name)}</h2>
            ${project.clientName ? `<span class="text-13 text-muted">${escapeHtml(project.clientName)}</span>` : ''}
        </div>
        ${(statusBadge || priorityBadge || project.location) ? `
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:12px">
            ${statusBadge}${priorityBadge}
            ${project.location ? `<span class="text-12 text-muted">${escapeHtml(project.location)}</span>` : ''}
        </div>` : ''}
        ${facts.length ? `
        <dl class="project-facts">
            ${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
        </dl>` : ''}
        <div class="project-progress">
            ${totalCats > 0 ? `
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${totalCats}" aria-valuenow="${confirmedCatsCount}" aria-label="BOQ categories confirmed"><div style="width:${progress}%"></div></div>
            <span class="text-12 text-secondary tnum">${confirmedCatsCount} of ${totalCats} categories confirmed</span>
            ` : `<span class="text-12 text-muted">No BOQ items yet</span>`}
        </div>
    </div>

    <div class="project-actions">
        <button class="btn btn-secondary" onclick="event.stopPropagation(); viewBOQ(${project.id}, '${safeName}')">View BOQ</button>
        ${isAdmin() ? `
        <button class="btn btn-secondary" onclick="event.stopPropagation(); openAccessModal(${project.id}, '${safeName}')">Manage access</button>` : ''}
        <button aria-label="Edit project" title="Edit project" class="dots-btn" onclick="event.stopPropagation(); editProject(${project.id})"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
    </div>
`;
        container.appendChild(card);
    });
}

        function selectProject(id, name) {
            localStorage.setItem('selectedProjectId', id);
            localStorage.setItem('selectedProjectName', name);
            window.location.href = 'project-detail.html';
        }

        function viewBOQ(id, name) {
            localStorage.setItem('selectedProjectId', id);
            localStorage.setItem('selectedProjectName', name);
            window.location.href = 'boq-detail.html';
        }

        async function openAccessModal(projectId, projectName) {
            let listEl = document.getElementById('access-user-list');
            listEl.innerHTML = skeleton(3);
            document.getElementById('access-modal').classList.add('open');

            let [usersRes, assignedRes] = await Promise.all([
                authFetch(`${API}/api/users`),
                authFetch(`${API}/api/project-assignments/${projectId}`)
            ]);
            if (!usersRes.ok || !assignedRes.ok) {
                listEl.innerHTML = '<p style="color:var(--destructive);font-size:13px">Could not load access.</p>';
                return;
            }
            let users = await usersRes.json();
            let assigned = new Set(await assignedRes.json());

            listEl.innerHTML = users.map(u => `
                <label class="checkbox-item" style="cursor:pointer">
                    <input type="checkbox" data-username="${u.username}" ${assigned.has(u.username) ? 'checked' : ''}
                        onchange="toggleAccess(${projectId}, '${u.username}', this.checked)">
                    <span>${u.username} <span style="color:var(--text-muted);font-size:12px">(${u.role})</span></span>
                </label>
            `).join('') || '<p style="color:var(--text-muted);font-size:13px">No other users yet.</p>';
        }

        async function toggleAccess(projectId, username, shouldAssign) {
            if (shouldAssign) {
                await authFetch(`${API}/api/project-assignments`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ projectId, username })
                });
                showToast(`${username} can now access this project`, 'success');
            } else {
                await authFetch(`${API}/api/project-assignments/${projectId}/${username}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                showToast(`${username} no longer has access`, 'info');
            }
        }

        document.getElementById('access-modal-close').addEventListener('click', function() {
            document.getElementById('access-modal').classList.remove('open');
            loadProjects();
        });

        async function editProject(id) {
            let response = await authFetch('https://construct-backend-production.up.railway.app/api/projects/' + id);
            let project = await response.json();
            editingId = id;
            document.getElementById('proj-name').value = project.name || '';
            document.getElementById('proj-location').value = project.location || '';
            document.getElementById('proj-status').value = project.status || '';
            document.getElementById('proj-priority').value = project.priority || '';
            document.getElementById('proj-clientName').value = project.clientName || '';
            document.getElementById('proj-budget').value = project.budget || '';
            document.getElementById('proj-startDate').value = project.startDate || '';
            document.getElementById('proj-endDate').value = project.endDate || '';
            document.getElementById('proj-sft').value = project.squareFootage || '';
            document.getElementById('modal-title').textContent = 'Edit Project';
            document.getElementById('confirm-btn').textContent = 'Save';
            document.getElementById('delete-project-btn').style.display = isAdmin() ? 'block' : 'none';
            modal.classList.add('open');
        }

        let modal = document.getElementById('modal-overlay');
        let addBtn = document.getElementById('add-btn');
        let cancelBtn = document.getElementById('cancel-btn');
        let confirmBtn = document.getElementById('confirm-btn');

        addBtn.addEventListener('click', function() {
    editingId = null;
    document.getElementById('proj-name').value = '';
    document.getElementById('proj-location').value = '';
    document.getElementById('proj-status').value = '';
    document.getElementById('proj-priority').value = '';
    document.getElementById('proj-clientName').value = '';
    document.getElementById('proj-budget').value = '';
    document.getElementById('proj-startDate').value = '';
    document.getElementById('proj-endDate').value = '';
    document.getElementById('proj-sft').value = '';
    document.getElementById('modal-title').textContent = 'New Project';
    document.getElementById('confirm-btn').textContent = 'Create';
    document.getElementById('delete-project-btn').style.display = 'none';
    modal.classList.add('open');
});

        cancelBtn.addEventListener('click', function() {
            modal.classList.remove('open');
            editingId = null;
        });

        confirmBtn.addEventListener('click', async function() {
            let name = document.getElementById('proj-name').value.trim();
            let location = document.getElementById('proj-location').value.trim();
            let status = document.getElementById('proj-status').value;
            let priority = document.getElementById('proj-priority').value;
            let clientName = document.getElementById('proj-clientName').value.trim();
let budget = document.getElementById('proj-budget').value;
let startDate = document.getElementById('proj-startDate').value;
let endDate = document.getElementById('proj-endDate').value;
let squareFootage = document.getElementById('proj-sft').value;
            if (name === '') {
                showToast('Please enter a project name', 'error');
                return;
            }

            let project = { name, location, status, priority, clientName, budget: parseFloat(budget), startDate, endDate, squareFootage: parseFloat(squareFootage) };

            if (editingId) {
                await authFetch('https://construct-backend-production.up.railway.app/api/projects/' + editingId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(project)
                });
            } else {
                await authFetch('https://construct-backend-production.up.railway.app/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(project)
                });
            }

            modal.classList.remove('open');
            editingId = null;
            loadProjects();
        });

        document.getElementById('delete-project-btn').addEventListener('click', async function() {
            if (await uiConfirm('Delete this project? This cannot be undone.')) {
                await authFetch('https://construct-backend-production.up.railway.app/api/projects/' + editingId, {
                    method: 'DELETE'
                });
                if (localStorage.getItem('selectedProjectId') == editingId) {
                    localStorage.removeItem('selectedProjectId');
                    localStorage.removeItem('selectedProjectName');
                }
                modal.classList.remove('open');
                editingId = null;
                loadProjects();
            }
        });

        loadProjects();
        updateCartCount();
    </script>
</body>
</html>
