<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Construct</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
</head>
<body>

    <div class="global-topbar">
        <div class="logo">Construct</div>
        <button class="nav-btn" id="project-selector-btn"> <span id="topbar-project-name">No Project</span></button>
        <div class="search-box">
            <input type="text" placeholder="Search projects...">
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-left:auto">
            <a href="catalog.html" class="nav-btn">Catalog</a>
            <a href="index.html" class="nav-btn active">Projects</a>
            <a href="boq-detail.html" class="nav-btn"> BOQ <span id="cart-count">0</span></a>
        </div>
    </div>

    <div class="page-body">
        <div class="sidebar">
            <button class="add-btn" id="add-btn" style="width:100%">+ New Project</button>
        </div>

        <div class="main-content">
            <h1>Projects</h1>
            <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center">
                <select id="filter-status" onchange="loadProjects()" style="padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text-primary)">
                    <option value="">All Status</option>
                    <option value="Active">Active</option>
                    <option value="On Hold">On Hold</option>
                    <option value="Completed">Completed</option>
                </select>
                <select id="filter-priority" onchange="loadProjects()" style="padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text-primary)">
                    <option value="">All Priority</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
                <select id="sort-projects" onchange="loadProjects()" style="padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text-primary)">
                    <option value="">Sort: Default</option>
                    <option value="priority-high">Priority: High First</option>
                    <option value="priority-low">Priority: Low First</option>
                    <option value="name">Name A-Z</option>
                    <option value="budget-high">Budget: High First</option>
                </select>
            </div>
            <div id="projects-container"></div>
        </div>
    </div>

    <!-- Add/Edit Project Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" style="width:620px;max-width:95vw">
            <h2 id="modal-title">New Project</h2>
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <input type="text" id="proj-name" placeholder="Project name">
                <input type="text" id="proj-clientName" placeholder="Client name">
                <input type="text" id="proj-location" placeholder="Site location">
                <div style="display:flex;gap:8px">
                    <select id="proj-status" style="flex:1">
                        <option value="">Status</option>
                        <option value="Active">Active</option>
                        <option value="On Hold">On Hold</option>
                        <option value="Completed">Completed</option>
                    </select>
                    <select id="proj-priority" style="flex:1">
                        <option value="">Priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div style="position:relative">
                    <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none">₹</span>
                    <input type="number" id="proj-budget" placeholder="Budget" style="padding-left:24px;width:100%">
                </div>
                <div style="position:relative">
                    <input type="number" id="proj-sft" placeholder="Area" style="padding-right:36px;width:100%">
                    <span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:12px;pointer-events:none">sqft</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:4px">
                    <label style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Start Date</label>
                    <input type="date" id="proj-startDate">
                </div>
                <div style="display:flex;flex-direction:column;gap:4px">
                    <label style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">End Date</label>
                    <input type="date" id="proj-endDate">
                </div>
            </div>
    
            <div class="modal-buttons" style="margin-top:16px">
                <button id="delete-project-btn" class="delete-btn" style="display:none">Delete</button>
                <button id="cancel-btn">Cancel</button>
                <button id="confirm-btn">Create</button>
            </div>
        </div>
    </div>

    <!-- Project Selector Modal -->
    <div class="modal-overlay" id="project-modal">
        <div class="modal">
            <h2>Select Project</h2>
            <div id="project-list-modal"></div>
            <div class="modal-buttons">
                <button id="project-modal-close">Close</button>
            </div>
        </div>
    </div>

    <script src="topbar.js"></script>
    <script>
        let editingId = null;

        const statusColors = {
            'Active': '#4ecb71',
            'On Hold': '#f0a050',
            'Completed': '#8892a4'
        };

        const priorityColors = {
            'High': '#e05252',
            'Medium': '#f0a050',
            'Low': '#4ecb71'
        };

        async function loadProjects() {
            let response = await authFetch('https://construct-backend-production.up.railway.app/api/projects');
            let projects = await response.json();
            let container = document.getElementById('projects-container');
            container.innerHTML = '';

            if (projects.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);padding:20px">No projects yet. Click + New Project to get started.</p>';
                return;
            }

            // Filter
let statusFilter = document.getElementById('filter-status').value;
let priorityFilter = document.getElementById('filter-priority').value;
let sortValue = document.getElementById('sort-projects').value;

if (statusFilter) projects = projects.filter(p => p.status === statusFilter);
if (priorityFilter) projects = projects.filter(p => p.priority === priorityFilter);

// Sort
const priorityOrder = { 'High': 1, 'Medium': 2, 'Low': 3 };
if (sortValue === 'priority-high') projects.sort((a, b) => (priorityOrder[a.priority] || 99) - (priorityOrder[b.priority] || 99));
if (sortValue === 'priority-low') projects.sort((a, b) => (priorityOrder[b.priority] || 99) - (priorityOrder[a.priority] || 99));
if (sortValue === 'name') projects.sort((a, b) => a.name.localeCompare(b.name));
if (sortValue === 'budget-high') projects.sort((a, b) => (b.budget || 0) - (a.budget || 0));

            projects.forEach(function(project) {
                let card = document.createElement('div');
                card.style.cssText = `
                    background: var(--surface);
                    border: 1px solid var(--border);
                    border-radius: 10px;
                    padding: 20px 24px;
                    margin-bottom: 10px;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    cursor: pointer;
                    transition: all 0.2s;
                `;
                let confirmed = JSON.parse(localStorage.getItem('confirmed-' + project.id)) || [];
let cart = JSON.parse(localStorage.getItem('cart-' + project.id)) || [];
let groups = {};
cart.forEach(item => { let k = item.category || 'Other'; if (!groups[k]) groups[k] = true; });
let totalCats = Object.keys(groups).length;
let confirmedCats = confirmed.length;
let progress = totalCats > 0 ? Math.round((confirmedCats / totalCats) * 100) : 0;

card.innerHTML = `
    <div style="flex:1;cursor:pointer" onclick="selectProject(${project.id}, '${project.name}')">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
            <div style="font-size:17px;font-weight:700;color:var(--text-primary);font-family:'Syne',sans-serif">${project.name}</div>
            ${project.clientName ? `<div style="font-size:13px;color:var(--text-muted)">${project.clientName}</div>` : ''}
        </div>

        <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
            <span style="font-size:11px;color:${statusColors[project.status] || 'var(--text-muted)'};background:${statusColors[project.status] || 'var(--text-muted)'}18;padding:3px 8px;border-radius:4px;font-weight:600">${project.status || '—'}</span>
            <span style="font-size:11px;color:${priorityColors[project.priority] || 'var(--text-muted)'};background:${priorityColors[project.priority] || 'var(--text-muted)'}18;padding:3px 8px;border-radius:4px;font-weight:600">${project.priority || '—'} Priority</span>
            ${project.location ? `<span style="font-size:12px;color:var(--text-muted)">· ${project.location}</span>` : ''}
        </div>

        <div style="display:flex;gap:24px;margin-bottom:12px">
            ${project.squareFootage ? `
                <div>
                    <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Area</div>
                    <div style="font-size:13.5px;font-weight:600;color:var(--text-primary)">${Number(project.squareFootage).toLocaleString('en-IN')} sqft</div>
                </div>` : ''}
            ${project.budget ? `
                <div>
                    <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Budget</div>
                    <div style="font-size:13.5px;font-weight:600;color:var(--text-primary)">₹${Number(project.budget).toLocaleString('en-IN')}</div>
                </div>` : ''}
            ${project.startDate ? `
                <div>
                    <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Timeline</div>
                    <div style="font-size:13.5px;font-weight:600;color:var(--text-primary)">${project.startDate} → ${project.endDate || '?'}</div>
                </div>` : ''}
        </div>

        <div style="display:flex;align-items:center;gap:10px">
            <div style="flex:1;height:3px;background:var(--border);border-radius:99px;overflow:hidden">
                <div style="height:100%;width:${progress}%;background:var(--accent);border-radius:99px;transition:width 0.3s"></div>
            </div>
            <span style="font-size:11.5px;color:var(--text-muted);white-space:nowrap;font-weight:500">${confirmedCats}/${totalCats} confirmed</span>
        </div>
    </div>

    <div style="display:flex;gap:8px;align-items:center;margin-left:20px;flex-shrink:0">
        <button onclick="event.stopPropagation(); viewBOQ(${project.id}, '${project.name}')"
            style="padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap"
            onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
            onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-secondary)'">
            View BOQ
        </button>
        <button class="dots-btn" onclick="event.stopPropagation(); editProject(${project.id})">⋮</button>
    </div>
`;
                card.addEventListener('mouseover', function() {
                    this.style.borderColor = 'var(--border-subtle)';
                    this.style.background = 'var(--surface-raised)';
                });
                card.addEventListener('mouseout', function() {
                    this.style.borderColor = 'var(--border)';
                    this.style.background = 'var(--surface)';
                });
                container.appendChild(card);
            });
        }

        function selectProject(id, name) {
            localStorage.setItem('selectedProjectId', id);
            localStorage.setItem('selectedProjectName', name);
            window.location.href = 'project-detail.html';
        }

        function viewBOQ(id, name) {
            localStorage.setItem('selectedProjectId', id);
            localStorage.setItem('selectedProjectName', name);
            window.location.href = 'boq-detail.html';
        }

        async function editProject(id) {
            let response = await authFetch('https://construct-backend-production.up.railway.app/api/projects/' + id);
            let project = await response.json();
            editingId = id;
            document.getElementById('proj-name').value = project.name || '';
            document.getElementById('proj-location').value = project.location || '';
            document.getElementById('proj-status').value = project.status || '';
            document.getElementById('proj-priority').value = project.priority || '';
            document.getElementById('proj-clientName').value = project.clientName || '';
            document.getElementById('proj-budget').value = project.budget || '';
            document.getElementById('proj-startDate').value = project.startDate || '';
            document.getElementById('proj-endDate').value = project.endDate || '';
            document.getElementById('proj-sft').value = project.squareFootage || '';
            document.getElementById('modal-title').textContent = 'Edit Project';
            document.getElementById('confirm-btn').textContent = 'Save';
            document.getElementById('delete-project-btn').style.display = 'block';
            modal.classList.add('open');
        }

        let modal = document.getElementById('modal-overlay');
        let addBtn = document.getElementById('add-btn');
        let cancelBtn = document.getElementById('cancel-btn');
        let confirmBtn = document.getElementById('confirm-btn');

        addBtn.addEventListener('click', function() {
    editingId = null;
    document.getElementById('proj-name').value = '';
    document.getElementById('proj-location').value = '';
    document.getElementById('proj-status').value = '';
    document.getElementById('proj-priority').value = '';
    document.getElementById('proj-clientName').value = '';
    document.getElementById('proj-budget').value = '';
    document.getElementById('proj-startDate').value = '';
    document.getElementById('proj-endDate').value = '';
    document.getElementById('proj-sft').value = '';
    document.getElementById('modal-title').textContent = 'New Project';
    document.getElementById('confirm-btn').textContent = 'Create';
    document.getElementById('delete-project-btn').style.display = 'none';
    modal.classList.add('open');
});

        cancelBtn.addEventListener('click', function() {
            modal.classList.remove('open');
            editingId = null;
        });

        confirmBtn.addEventListener('click', async function() {
            let name = document.getElementById('proj-name').value.trim();
            let location = document.getElementById('proj-location').value.trim();
            let status = document.getElementById('proj-status').value;
            let priority = document.getElementById('proj-priority').value;
            let clientName = document.getElementById('proj-clientName').value.trim();
let budget = document.getElementById('proj-budget').value;
let startDate = document.getElementById('proj-startDate').value;
let endDate = document.getElementById('proj-endDate').value;
let squareFootage = document.getElementById('proj-sft').value;
            if (name === '') {
                alert('Please enter a project name');
                return;
            }

            let project = { name, location, status, priority, clientName, budget: parseFloat(budget), startDate, endDate, squareFootage: parseFloat(squareFootage) };

            if (editingId) {
                await authFetch('https://construct-backend-production.up.railway.app/api/projects/' + editingId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(project)
                });
            } else {
                await authFetch('https://construct-backend-production.up.railway.app/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(project)
                });
            }

            modal.classList.remove('open');
            editingId = null;
            loadProjects();
        });

        document.getElementById('delete-project-btn').addEventListener('click', async function() {
            if (confirm('Delete this project? This cannot be undone.')) {
                await authFetch('https://construct-backend-production.up.railway.app/api/projects/' + editingId, {
                    method: 'DELETE'
                });
                if (localStorage.getItem('selectedProjectId') == editingId) {
                    localStorage.removeItem('selectedProjectId');
                    localStorage.removeItem('selectedProjectName');
                }
                modal.classList.remove('open');
                editingId = null;
                loadProjects();
            }
        });

        loadProjects();
        updateCartCount();
    </script>
</body>
</html>
